const bridge = (() => {

    deviceName: "", deviceAddress: "", devices: [],
    lastData: null, distanceSamples: [], rawLog: [], rssi: -90, errorMsg: "",

    onScanStateChanged(scanning) {
      state.scanning = !!scanning; if (state.scanning) state.devices = []; emit();
    },
    onDeviceFound(name, address, rssi) {
      const entry = { name: normalizeDeviceName(name) || "Desconhecido", address: String(address || ""), rssi: Number(rssi) || -90 };
      if (!entry.address) return;
      const idx = state.devices.findIndex(d => d.address === entry.address);
      if (idx >= 0) state.devices[idx] = entry; else state.devices = [...state.devices, entry];
      emit();
    },
    onConnectionStateChanged(status, deviceName, deviceAddress) {
      state.connectionStatus = String(status || "Unknown");
      state.connected = state.connectionStatus === "Connected";
      if (state.connected) {
        state.deviceName = normalizeDeviceName(deviceName) || state.deviceName;
        state.deviceAddress = String(deviceAddress || state.deviceAddress || "");
        state.sandMode = null;
        clearReadingBuffers(); armFirstReadingDiscard();
      } else { state.lastData = null; }
      emit();
    },
    onDataReceived(raw) {
      const text = String(raw || "").trim();
      // Firmware control messages (sand mode, wash log, version, self-test)
      // are consumed here and never reach the distance parser.
      if (/^(SAND|WL|VER|ST|CAL|CFG)=/.test(text)) {
        controlSeq += 1;
        if (text.startsWith("SAND=")) state.sandMode = text === "SAND=1";
        else if (text.startsWith("VER=")) state.firmwareVersion = text.slice(4);
        else if (text.startsWith("CFG=")) {
          // CFG=<key>,<val>,<def>,<min>,<max>,<desc> | CFG=END | CFG=OK,... | CFG=ERR,...
          const body = text.slice(4);
          const prev = state.washCfg || { items: [], loaded: false, error: "" };
          if (body === "END") {
            state.washCfg = { ...prev, loaded: true };
          } else if (body.startsWith("OK,")) {
            const p = body.slice(3).split(",");
            const items = prev.items.map(it => it.key === p[0] ? { ...it, val: Number(p[1]) } : it);
            state.washCfg = { ...prev, items, savedKey: p[0], savedAt: Date.now(), error: "" };
          } else if (body.startsWith("ERR,")) {
            state.washCfg = { ...prev, error: body.slice(4), savedAt: Date.now() };
          } else {
            const p = body.split(",");
            if (p.length >= 5) {
              const item = {
                key: p[0], val: Number(p[1]), def: Number(p[2]),
                min: Number(p[3]), max: Number(p[4]), desc: p.slice(5).join(","),
              };
              const items = prev.items.some(it => it.key === item.key)
                ? prev.items.map(it => it.key === item.key ? item : it)

          } else {

            const factor = parseFloat(parts[0]);

/* ===== SYNC FUNCTIONS ===== */
async function syncSessions(serverUrl, setSyncState, originLabel = "startup") {
  const pending = readPendingSessions();
  if (!pending.length) {
    setSyncState(s => ({ ...s, status: "idle", pendingCount: 0, message: "Sem sessões pendentes." }));
    return;
  }
  if (!/^https?:\/\//i.test(String(serverUrl || ""))) {
    setSyncState(s => ({ ...s, status: "error", pendingCount: pending.length, message: "URL inválida." }));
    return;
  }
  setSyncState(s => ({ ...s, status: "syncing", pendingCount: pending.length, message: `Enviando ${pending.length} sessão(es)...` }));
  const remaining = []; let sent = 0, lastError = "";
  for (const session of pending) {
    try {
      const r = await fetch(serverUrl, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ schemaVersion: 1, app: "FilterTrack", uploadedAt: nowIso(), session }) });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      sent++;
    } catch (err) { remaining.push(session); lastError = err?.message || "Falha"; }
  }
  writePendingSessions(remaining);
  const lastSyncAt = sent > 0 ? nowIso() : loadText(STORAGE.lastSyncAt, "");
  if (sent > 0) saveText(STORAGE.lastSyncAt, lastSyncAt);
  const status = remaining.length === 0 ? "success" : sent > 0 ? "partial" : "error";
  const message = status === "success" ? `Sincronizado. ${sent} sessão(es) enviadas.`
    : status === "partial" ? `Parcial. ${sent} enviada(s), ${remaining.length} pendente(s).`
    : `Não foi possível enviar. ${lastError}`;
  setSyncState(s => ({ ...s, status, pendingCount: remaining.length, message, lastSuccessAt: lastSyncAt }));
}

  catch (_) { return ""; }
}

    if (r.archived) { byId.delete(r.id); return; }
    const current = byId.get(r.id);
    const rAt = r.updatedAt || r.approvedAt || r.createdAt || "";
    const lAt = (current && current.updatedAt) || "";
    if (current && lAt && rAt && lAt >= rAt) return;
    byId.set(r.id, { ...(current || {}), id: r.id,
      name: r.name || (current && current.name) || "",
      areaM2: r.areaM2 == null ? (current && current.areaM2) : r.areaM2,
      station: r.station || "", location: r.location || "", businessUnit: r.businessUnit || "",
      custom: current ? current.custom : false, updatedAt: rAt });
  });
  return mergeDefaultFilters(Array.from(byId.values()));
}
async function syncFilterCatalog(serverUrl, setFilters) {
  const url = deriveFiltersUrl(serverUrl); if (!url) return;
  try {
    const r = await fetch(url, { method: "GET" }); if (!r.ok) return;
    const body = await r.json();
    const items = body && Array.isArray(body.items) ? body.items : [];
    if (!items.length) return;
    setFilters(current => mergeRemoteFilters(current, items));
  } catch (_) {}
}

/* ===== FLOW CHART ===== */
function FlowChart({ history }) {
  const ref = useRef(null);
  const sampled = useMemo(() => downsample(history, 200), [history]);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const dpr = window.devicePixelRatio || 1;
    const W = c.clientWidth, H = c.clientHeight;
    if (!W || !H) return;
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext("2d"); g.scale(dpr, dpr);
    g.clearRect(0, 0, W, H); g.fillStyle = T.canvas; g.fillRect(0, 0, W, H);
    if (sampled.length < 2) {
      g.fillStyle = T.inkTertiary; g.font = "14px IBM Plex Sans"; g.textAlign = "center";
      g.fillText("Aguardando dados...", W / 2, H / 2); return;
    }
    const pad = { l: 48, r: 12, t: 12, b: 24 };
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    const ts = sampled.map(p => p.ts), vs = sampled.map(p => p.velocityMpm);
    const tMin = ts[0], tMax = ts[ts.length - 1];
    const vMin = Math.min(...vs), vMax = Math.max(...vs);
    const vPad = Math.max(0.05, (vMax - vMin) * 0.2);
    const yMin = vMin - vPad, yMax = vMax + vPad;
    const x = i => pad.l + (ts[i] - tMin) / (tMax - tMin || 1) * cw;
    const y = v => pad.t + (1 - (v - yMin) / (yMax - yMin || 1)) * ch;
    g.strokeStyle = T.hairline; g.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const yy = pad.t + (i / 4) * ch;
      g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(W - pad.r, yy); g.stroke();
      const v = yMax - (i / 4) * (yMax - yMin);
      g.fillStyle = T.inkSubtle; g.font = "11px IBM Plex Mono"; g.textAlign = "right";
      g.fillText(v.toFixed(1), pad.l - 6, yy + 4);
    }
    g.strokeStyle = T.blue; g.lineWidth = 2; g.beginPath();
    sampled.forEach((p, i) => {
      const px = x(i), py = y(p.velocityMpm);
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    });
    g.stroke();
    const lastX = x(sampled.length - 1);
    g.lineTo(lastX, pad.t + ch); g.lineTo(x(0), pad.t + ch);
    g.closePath(); g.fillStyle = T.blue + "14"; g.fill();
    g.fillStyle = T.inkSubtle; g.font = "11px IBM Plex Mono";
    g.textAlign = "left"; g.fillText(`-${Math.round((tMax - tMin) / 1000)}s`, pad.l, H - 6);
    g.textAlign = "right"; g.fillText("agora", W - pad.r, H - 6);
  }, [sampled]);
  return <canvas ref={ref} style={{ width: "100%", height: 180, display: "block" }} />;
}

/* Chart do modo simplificado: mais detalhe que o FlowChart — grade fina com
   horários reais, separação visual de cada processo de filtração (um gap nas
   amostras = lavagem/reinício de sessão) e marcador do valor atual. */
const MINIMAL_CYCLE_GAP_MS = 45000;

function splitFlowCycles(points) {
  const cycles = [];
  let cur = [];
  for (let i = 0; i < points.length; i++) {
    if (cur.length > 0 && points[i].ts - points[i - 1].ts > MINIMAL_CYCLE_GAP_MS) {
      cycles.push(cur);
      cur = [];
    }
    cur.push(points[i]);
  }
  if (cur.length > 0) cycles.push(cur);
  return cycles;
}

function MinimalFlowChart({ history }) {
  const ref = useRef(null);
  const sampled = useMemo(() => downsample(history, 300), [history]);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const dpr = window.devicePixelRatio || 1;
    const W = c.clientWidth, H = c.clientHeight;
    if (!W || !H) return;
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext("2d"); g.scale(dpr, dpr);
    g.clearRect(0, 0, W, H); g.fillStyle = T.canvas; g.fillRect(0, 0, W, H);
    if (sampled.length < 2) {
      g.fillStyle = T.inkTertiary; g.font = "14px IBM Plex Sans"; g.textAlign = "center";
      g.fillText("Aguardando dados...", W / 2, H / 2); return;
    }
    const pad = { l: 52, r: 14, t: 16, b: 30 };
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    const ts = sampled.map(p => p.ts), vs = sampled.map(p => Math.abs(p.velocityMpm));
    const tMin = ts[0], tMax = ts[ts.length - 1];
    const vMin = Math.min(...vs), vMax = Math.max(...vs);
    const vPad = Math.max(0.03, (vMax - vMin) * 0.18);
    const yMin = Math.max(0, vMin - vPad), yMax = vMax + vPad;
    const xOf = t => pad.l + (t - tMin) / (tMax - tMin || 1) * cw;
    const y = v => pad.t + (1 - (v - yMin) / (yMax - yMin || 1)) * ch;

    // Grade horizontal (5 divisões; casas decimais conforme a faixa)
    const yDec = (yMax - yMin) < 0.2 ? 3 : 2;
    g.strokeStyle = T.hairline; g.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const yy = pad.t + (i / 5) * ch;
      g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(W - pad.r, yy); g.stroke();
      const v = yMax - (i / 5) * (yMax - yMin);
      g.fillStyle = T.inkSubtle; g.font = "10px IBM Plex Mono"; g.textAlign = "right";
      g.fillText(v.toFixed(yDec), pad.l - 6, yy + 3);
    }

    // Grade vertical com horários reais
    const spanMs = tMax - tMin;
    const shortSpan = spanMs < 10 * 60 * 1000;
    const timeFmt = shortSpan
      ? { hour: "2-digit", minute: "2-digit", second: "2-digit" }
      : { hour: "2-digit", minute: "2-digit" };
    const nTicks = shortSpan ? 2 : 4;   // rótulos HH:MM:SS são largos
    g.font = "10px IBM Plex Mono";
    for (let i = 0; i <= nTicks; i++) {
      const t = tMin + (i / nTicks) * spanMs;
      const xx = xOf(t);
      if (i > 0 && i < nTicks) {
        g.strokeStyle = T.hairline; g.beginPath();
        g.moveTo(xx, pad.t); g.lineTo(xx, pad.t + ch); g.stroke();
      }
      g.fillStyle = T.inkSubtle;
      g.textAlign = i === 0 ? "left" : i === nTicks ? "right" : "center";
      g.fillText(new Date(t).toLocaleTimeString("pt-BR", timeFmt), xx, H - 8);
    }

    // Cada processo de filtração vira um segmento próprio (linha + área);
    // a divisa entre eles (lavagem/reinício) é uma linha tracejada.
    const cycles = splitFlowCycles(sampled);
    cycles.forEach((cycle, ci) => {
      if (ci > 0) {
        const xx = xOf(cycle[0].ts);
        g.save();
        g.strokeStyle = T.inkTertiary; g.lineWidth = 1; g.setLineDash([4, 4]);
        g.beginPath(); g.moveTo(xx, pad.t); g.lineTo(xx, pad.t + ch); g.stroke();
        g.restore();
      }
      if (cycle.length < 2) return;
      g.strokeStyle = T.blue; g.lineWidth = 2; g.beginPath();
      cycle.forEach((p, i) => {
        const px = xOf(p.ts), py = y(Math.abs(p.velocityMpm));
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
      });
      g.stroke();
      g.lineTo(xOf(cycle[cycle.length - 1].ts), pad.t + ch);
      g.lineTo(xOf(cycle[0].ts), pad.t + ch);
      g.closePath(); g.fillStyle = T.blue + "18"; g.fill();
    });

    // Marcador do valor atual
    const last = sampled[sampled.length - 1];
    const lx = xOf(last.ts), ly = y(Math.abs(last.velocityMpm));
    g.fillStyle = T.blue;
    g.beginPath(); g.arc(lx, ly, 4, 0, Math.PI * 2); g.fill();
    g.strokeStyle = T.canvas; g.lineWidth = 1.5; g.stroke();
    const label = Math.abs(last.velocityMpm).toFixed(2);
    g.font = "11px IBM Plex Mono";
    const tw = g.measureText(label).width;
    const bx = Math.min(Math.max(lx - tw / 2, pad.l), W - pad.r - tw - 8);
    g.fillStyle = T.blue;
    g.fillRect(bx - 4, Math.max(2, ly - 24), tw + 8, 16);
    g.fillStyle = "#ffffff"; g.textAlign = "left";
    g.fillText(label, bx, Math.max(2, ly - 24) + 12);
  }, [sampled]);
  return <canvas ref={ref} style={{ width: "100%", height: 230, display: "block" }} />;
}

function DistanceDebugChart({ history }) {
  const ref = useRef(null);
  const sampled = useMemo(() => downsample((history || []).filter(p => Number.isFinite(p.distance)), 220), [history]);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const dpr = window.devicePixelRatio || 1;
    const W = c.clientWidth, H = c.clientHeight;
    if (!W || !H) return;
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext("2d"); g.scale(dpr, dpr);
    g.clearRect(0, 0, W, H); g.fillStyle = T.canvas; g.fillRect(0, 0, W, H);
    if (sampled.length < 2) {
      g.fillStyle = T.inkTertiary; g.font = "13px IBM Plex Sans"; g.textAlign = "center";
      g.fillText("Sem amostras de distância", W / 2, H / 2); return;
    }
    const pad = { l: 42, r: 10, t: 10, b: 22 };
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    const ts = sampled.map(p => p.ts), ds = sampled.map(p => p.distance);
    const tMin = ts[0], tMax = ts[ts.length - 1];
    const dMin = Math.min(...ds), dMax = Math.max(...ds);
    const dPad = Math.max(1, (dMax - dMin) * 0.2);
    const yMin = dMin - dPad, yMax = dMax + dPad;
    const x = i => pad.l + (ts[i] - tMin) / (tMax - tMin || 1) * cw;
    const y = v => pad.t + (1 - (v - yMin) / (yMax - yMin || 1)) * ch;
    g.strokeStyle = T.hairline; g.lineWidth = 1;
    for (let i = 0; i <= 3; i++) {
      const yy = pad.t + (i / 3) * ch;
      g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(W - pad.r, yy); g.stroke();
      const v = yMax - (i / 3) * (yMax - yMin);
      g.fillStyle = T.inkSubtle; g.font = "10px IBM Plex Mono"; g.textAlign = "right";
      g.fillText(v.toFixed(1), pad.l - 5, yy + 4);
    }
    g.strokeStyle = T.teal; g.lineWidth = 2; g.beginPath();
    sampled.forEach((p, i) => {
      const px = x(i), py = y(p.distance);
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    });
    g.stroke();
    g.fillStyle = T.inkSubtle; g.font = "10px IBM Plex Mono";
    g.textAlign = "left"; g.fillText(`-${Math.round((tMax - tMin) / 1000)}s`, pad.l, H - 6);
    g.textAlign = "right"; g.fillText("agora", W - pad.r, H - 6);
  }, [sampled]);
  return <canvas ref={ref} style={{ width: "100%", height: 150, display: "block" }} />;
}

/* ===== MONITOR TAB ===== */
function MonitorTab({ ble, filter, flowVelocity, flowInstant, flowHistory, flowReason, flowWaitSeconds = 0, activeSessionMeta, onPickFilter, onStartSession }) {
  const [sessionNow, setSessionNow] = useState(Date.now());
  const [flowUnit, setFlowUnit] = useState("lpm");
  useEffect(() => { const id = setInterval(() => setSessionNow(Date.now()), 1000); return () => clearInterval(id); }, []);
  const flowClass = classifyFlow(flowInstant);
  const velocityClass = classifyFlow(flowVelocity);
  const flowValue = flowUnit === "lpm" ? Math.abs(flowInstant) : Math.abs(flowInstant * 0.06);
  const flowLabel = flowUnit === "lpm" ? "L/min" : "m3/h";
  const flowDecimals = flowUnit === "lpm" ? 1 : 2;
  const hasFlowVelocity = Number.isFinite(flowVelocity);
  const hasFlow = hasFlowVelocity && Number.isFinite(flowInstant);
  const collecting = !hasFlowVelocity && Number(flowWaitSeconds) > 0;
  const velocityReason = String(flowReason || "Aguardando janela de 10s.").trim();
  const unavailableText = collecting ? `Coletando dados (${Math.max(0, Math.ceil(Number(flowWaitSeconds)))}s)` : velocityReason;
  const flowUnavailableText = !hasFlowVelocity
    ? unavailableText
    : (!filter || !Number.isFinite(Number(filter.areaM2)) ? "Área do filtro indisponível." : "Vazão indisponível.");
  const deviceDisplay = { name: ble.deviceName, address: ble.deviceAddress };
  const hideDeviceAddress = shouldHideDeviceAddress(deviceDisplay);
  const chartHistory = useMemo(() =>
    flowHistory.filter(p => Number.isFinite(p.velocityMpm)).map(p => ({ ts: p.ts, velocityMpm: p.velocityMpm })),
    [flowHistory]);
  const sessionRunning = !!activeSessionMeta;
  const filterNumber = getFilterNumber(filter);
  const filterDirection = getFilterDirection(filter);
  const metricTileStyle = { minHeight: 132, display: "grid", gridTemplateRows: "34px 1fr minmax(28px, auto)" };
  const metricLabelStyle = { fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", lineHeight: 1.25 };
  const metricValueStyle = { fontFamily: T.mono, fontSize: 27, fontWeight: 400, lineHeight: 1, letterSpacing: 0, whiteSpace: "nowrap", alignSelf: "center" };
  const renderUnavailableStatus = () => (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      {collecting && <Spinner size={14} />}
      <span>{unavailableText}</span>
    </div>
  );
  const renderFlowUnavailableStatus = () => (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      {collecting && <Spinner size={14} />}
      <span>{flowUnavailableText}</span>
    </div>
  );
  return (
    <div data-guide="full-monitor" style={{ flex: 1, overflow: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 14, background: T.surface1 }}>
      {/* Connection bar */}
      <Tile padding={14} style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <span style={{ width: 10, height: 10, background: T.success, borderRadius: 10, flexShrink: 0, boxShadow: `0 0 0 4px ${T.success}22` }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontWeight: 500, fontSize: 15, overflowWrap: "anywhere" }}>{ble.deviceName || ble.deviceAddress}</div>
          {!hideDeviceAddress && <div style={{ fontFamily: T.mono, fontSize: 12, color: T.inkSubtle, overflowWrap: "anywhere" }}>{ble.deviceAddress}</div>}
        </div>
        <SignalBars rssi={ble.rssi} />
        <button data-requires-sensor="true" onClick={ble.disconnect} style={{ fontSize: 14, color: T.blue, padding: "4px 6px", flexShrink: 0 }}>Desconectar</button>
      </Tile>

      {/* Filter chooser */}
      {filter ? (
        <Tile padding={16}>
          <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 6 }}>Filtro selecionado</div>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {filterNumber && <Tag tone="blue">Filtro {filterNumber}</Tag>}
                {filterDirection && <Tag>{filterDirection}</Tag>}
              </div>
              <div style={{ fontSize: 13, color: T.inkSubtle, marginTop: 10, overflowWrap: "anywhere" }}>{filter.location}</div>
              <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                <Tag tone="blue">{filter.businessUnit}</Tag>
                <Tag>Área {formatAreaLabel(filter.areaM2)}</Tag>
              </div>
            </div>
            <Btn kind="ghost" size="sm" onClick={onPickFilter}>Trocar</Btn>
          </div>
        </Tile>
      ) : (
        <Tile padding={16}>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div>
              <div style={{ fontWeight: 500, fontSize: 16 }}>Selecione um filtro</div>
              <div style={{ fontSize: 14, color: T.inkSubtle }}>A vazão depende da área do filtro.</div>
            </div>
            <Btn kind="primary" full onClick={onPickFilter}>Escolher filtro</Btn>
          </div>
        </Tile>
      )}

      {/* Big metrics */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Tile padding={16} style={metricTileStyle}>
          <div style={metricLabelStyle}>Velocidade de subida</div>
          <div style={metricValueStyle}>
            {hasFlowVelocity ? Math.abs(flowVelocity).toFixed(2) : "--"}
            <span style={{ fontSize: 13, color: T.inkSubtle, marginLeft: 4 }}>m/min</span>
          </div>
          <div style={{ fontSize: hasFlowVelocity ? 13 : 12, color: T.inkSubtle, alignSelf: "end", lineHeight: 1.25 }}>
            {hasFlowVelocity ? <Tag tone={velocityClass.tone}>{velocityClass.label}</Tag> : renderUnavailableStatus()}
          </div>
        </Tile>
        <Tile padding={0} style={{ ...metricTileStyle, cursor: "pointer" }}>
          <button onClick={() => setFlowUnit(u => u === "lpm" ? "m3h" : "lpm")} style={{ width: "100%", height: "100%", padding: 16, display: "grid", gridTemplateRows: "34px 1fr minmax(28px, auto)", textAlign: "left" }}>
          <div style={metricLabelStyle}>Vazão</div>
          <div style={{
            ...metricValueStyle,
            color: hasFlow && flowClass.tone === "danger" ? T.danger : hasFlow && flowClass.tone === "success" ? T.success : T.ink,
          }}>
            {hasFlow ? flowValue.toFixed(flowDecimals) : "--"}
            <span style={{ fontSize: 13, color: T.inkSubtle, marginLeft: 4 }}>{flowLabel}</span>
          </div>
          <div style={{ fontSize: 12, color: T.inkSubtle, alignSelf: "end", lineHeight: 1.25 }}>
            {hasFlow ? "Toque para alternar" : renderFlowUnavailableStatus()}
          </div>
          </button>
        </Tile>
      </div>

      {/* Chart */}
      <Tile padding={0} style={{ overflow: "hidden" }}>
        <div style={{ padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${T.hairline}` }}>
          <div style={{ fontSize: 14, fontWeight: 500 }}>Velocidade de subida</div>
          <Tag tone="blue">tempo real</Tag>
        </div>
        <FlowChart history={chartHistory} />
      </Tile>

      {/* Session control */}
      {sessionRunning ? (
        <Tile padding={14} style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ width: 12, height: 12, background: T.danger, borderRadius: 12, flexShrink: 0, animation: "pulse 1.4s infinite" }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Sessão em andamento</div>
            <div style={{ fontFamily: T.mono, fontSize: 13, color: T.inkSubtle }}>
              {formatDuration(sessionNow - activeSessionMeta.startedAtMs)} · {sampleSeriesCount(activeSessionMeta?.samples || null)} amostras
            </div>
          </div>
          <Btn data-requires-sensor="true" kind="danger" size="sm" onClick={onStartSession}>Encerrar</Btn>
        </Tile>
      ) : (
        <Btn data-requires-sensor="true" kind="primary" size="lg" full disabled={!filter} onClick={onStartSession}
          iconRight={<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="4" /></svg>}>
          Iniciar sessão de coleta
        </Btn>
      )}
    </div>
  );
}

function SessionsTab({ syncState, onSync }) {
  const [archive, setArchive] = useState(() => {
    const a = loadJson(STORAGE.sessionArchive, []);
    return Array.isArray(a) ? a.slice().reverse().slice(0, 30) : [];
  });
  useEffect(() => {
    const a = loadJson(STORAGE.sessionArchive, []);
    setArchive(Array.isArray(a) ? a.slice().reverse().slice(0, 30) : []);
  }, [syncState]);
  const pendingIds = useMemo(() => {
    const p = readPendingSessions();
    return new Set(p.map(s => s.id));
  }, [syncState]);
  return (
    <div style={{ flex: 1, overflow: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 14, background: T.surface1 }}>

            {syncState.pendingCount > 0 ? `${syncState.pendingCount} pendente(s)` : "Sem pendentes"}

          </div>
        </div>
        <Btn kind="tertiary" size="sm" onClick={onSync} disabled={syncState.status === "syncing"}>

        </Btn>

      {syncState.message && syncState.status !== "idle" && (
        <div style={{
          fontSize: 13, padding: "10px 14px", background: T.canvas, border: `1px solid ${T.hairline}`,
          color: syncState.status === "success" ? T.success : syncState.status === "error" ? T.danger : T.inkMuted,
        }}>
          {syncState.message}
        </div>
      )}

      <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", paddingLeft: 4 }}>

        <Tile padding={32} style={{ textAlign: "center" }}>
          <div style={{ fontSize: 15, color: T.inkSubtle }}>Nenhuma sessão gravada</div>

          <Tile key={s.id} padding={16}>

                <div style={{ fontSize: 13, color: T.inkSubtle, marginTop: 2 }}>{s.filter ? s.filter.station : ""}</div>
                <div style={{ fontFamily: T.mono, fontSize: 12, color: T.inkSubtle, marginTop: 4 }}>
                  {started}{duration > 0 ? ` · ${formatDuration(duration)}` : ""} · {count} amostras
                </div>
              </div>
              <Tag tone={isPending ? "warning" : "success"}>{isPending ? "Pendente" : "Enviada"}</Tag>
            </div>
          </Tile>
        );
      })}
    </div>
  );
}

    const t = setTimeout(() => ble.sendCommand?.("CAL:GET"), 1500);
    const t2 = setTimeout(() => ble.sendCommand?.("CFG:GET"), 2500);
    return () => { clearTimeout(t); clearTimeout(t2); };
  }, [ble?.connected]);
  const washCfg = ble?.washCfg || null;
  const cfgSave = (item) => {
    const raw = cfgEdits[item.key];
    const v = Math.round(Number(String(raw).replace(",", ".")));
    if (!Number.isFinite(v)) { setCommandStatus("Valor inválido."); return; }
    ble?.sendCommand?.(`CFG:SET:${item.key}:${v}`);
    setCfgEdits(e => { const n = { ...e }; delete n[item.key]; return n; });
  };
  const cfgReset = () => {
    setConfirmAction({
      title: "Restaurar padrões",
      message: "Todos os fatores da detecção de lavagem voltam aos valores de fábrica do firmware.",
      confirmLabel: "Restaurar",
      tone: "danger",
      onConfirm: () => { ble?.sendCommand?.("CFG:RESET"); setTimeout(() => ble?.sendCommand?.("CFG:GET"), 800); setCfgEdits({}); },
    });
  };
  const save = () => { setServerUrl(url); setSaved(true); setTimeout(() => setSaved(false), 2000); };
  const sendSensorCommand = (cmd, label) => {
    if (!ble?.connected) {
      setCommandStatus("Conecte um sensor para enviar comandos.");
      return;
    }
    const ok = ble.sendCommand(String(cmd));
    setCommandStatus(ok === false ? "Falha ao enviar comando." : `${label} enviado.`);
  };
  const enableLowPower = () => {
    setConfirmAction({
      title: "Ativar baixo consumo",
      message: "A sessão atual será encerrada e salva localmente antes do comando ser enviado.",
      confirmLabel: "Ativar",
      tone: "secondary",
      onConfirm: () => {
        if (activeSessionMeta) onEndSession?.("low_power", true);
        sendSensorCommand(1, "Baixo consumo");
      },
    });
  };
  const restartSensor = () => {
    setConfirmAction({
      title: "Reiniciar sensor",
      message: "A sessão atual será encerrada antes do comando. O sensor pode desconectar por alguns segundos; o app continuará procurando e, se reconectar automaticamente, manterá o filtro atual sem abrir a seleção de filtros.",
      confirmLabel: "Reiniciar",
      tone: "danger",
      onConfirm: () => {
        if (activeSessionMeta) onEndSession?.("restart_sensor", true);
        const ok = onRestartSensor ? onRestartSensor() : ble?.sendCommand?.("0");
        setCommandStatus(ok === false ? "Falha ao enviar comando." : "Reinício enviado. Aguardando reconexão automática.");
      },
    });
  };
  const runConfirmedAction = () => {
    const action = confirmAction;
    setConfirmAction(null);
    action?.onConfirm?.();
  };
  const calInfo = ble?.calInfo || null;
  const calLiveCm = ble?.lastData && Number.isFinite(ble.lastData.distance) ? ble.lastData.distance : NaN;
  const CAL_ERROR_TEXT = {
    valor: "Valor inválido.",
    semleitura: "Sensor sem leitura recente — aguarde alguns segundos e tente de novo.",
    faixa: "A distância informada está muito diferente da medida pelo sensor. Confira o valor.",
  };
  const calibrateSensor = () => {
    const real = parseFloat(String(calInput).replace(",", "."));
    if (!Number.isFinite(real) || real <= 0) {
      setCommandStatus("Informe a distância real até a água em cm.");
      return;
    }
    setConfirmAction({
      title: "Calibrar inclinação do sensor",
      message: `O sensor mede ${Number.isFinite(calLiveCm) ? calLiveCm.toFixed(1) : "--"} cm agora e a distância real informada é ${real} cm. Faça isso com o nível parado (filtro fora de lavagem). O fator de correção fica salvo no sensor e passa a corrigir todas as medições.`,
      confirmLabel: "Calibrar",
      tone: "secondary",
      onConfirm: () => sendSensorCommand(`CAL:SET:${real}`, "Comando de calibração"),
    });
  };
  const clearCalibration = () => {
    setConfirmAction({
      title: "Remover calibração",
      message: "O sensor voltará a usar a distância medida sem correção de inclinação.",
      confirmLabel: "Remover",
      tone: "danger",
      onConfirm: () => sendSensorCommand("CAL:CLEAR", "Comando de remoção"),
    });
  };
  const ota = ble?.ota || { status: "idle", sent: 0, total: 0, message: "" };
  const otaBusy = ["starting", "transferring", "verifying"].includes(ota.status);
  const otaPct = ota.total > 0 ? Math.round((ota.sent / ota.total) * 100) : 0;
  const startOta = () => {
    setConfirmAction({
      title: "Atualizar firmware",
      message: "Selecione o arquivo .bin gerado pelo build (FilterTrackv3.bin). A transferência leva alguns minutos; mantenha o app aberto e o sensor ligado. Ao final o sensor reinicia sozinho com o novo firmware.",
      confirmLabel: "Selecionar arquivo",
      tone: "secondary",
      onConfirm: () => ble?.updateFirmware?.(),
    });
  };
  return (
    <>
    <div style={{ flex: 1, overflow: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 16, background: T.surface1 }}>
      <Tile data-requires-sensor="true" padding={16}>
        <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 12 }}>Sensor</div>
        <div style={{ fontSize: 13, color: T.inkSubtle, marginBottom: 12 }}>
          Comandos BLE para o firmware FilterTrackV3.
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 8 }}>
          <Btn kind="tertiary" full disabled={!ble?.connected} onClick={() => sendSensorCommand(2, "Leitura normal")}>
            Leitura normal
          </Btn>
          <Btn kind="secondary" full disabled={!ble?.connected} onClick={enableLowPower}>
            Baixo consumo
          </Btn>
          <Btn kind="danger" full disabled={!ble?.connected} onClick={restartSensor}>
            Reiniciar sensor
          </Btn>
        </div>
        <div style={{ fontSize: 12, color: T.inkSubtle, marginTop: 10 }}>
          {commandStatus || (ble?.connected ? "Sensor conectado." : "Nenhum sensor conectado.")}
        </div>
      </Tile>

      <Tile data-requires-sensor="true" padding={16}>
        <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 12 }}>Calibração de inclinação</div>
        <div style={{ fontSize: 13, color: T.inkSubtle, marginBottom: 12 }}>
          Se o sensor estiver inclinado, ele mede uma distância maior que a real. Com o nível parado (fora de lavagem), meça a distância vertical real até a água e informe abaixo: o sensor calcula o ângulo e passa a corrigir todas as medições.
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 12, marginBottom: 12 }}>
          <span style={{ fontSize: 13, color: T.inkSubtle }}>Distância medida agora</span>
          <span style={{ fontSize: 13, fontVariantNumeric: "tabular-nums" }}>
            {Number.isFinite(calLiveCm) ? `${calLiveCm.toFixed(1)} cm` : "--"}
          </span>
        </div>
        <input
          value={calInput}
          onChange={e => setCalInput(e.target.value)}
          inputMode="decimal"
          placeholder="Distância real até a água (cm)"
          style={{
            width: "100%", height: 48, padding: "0 14px", background: T.surface1,
            border: "none", borderBottom: `1px solid ${T.hairlineStrong}`,
            fontSize: 14, color: T.ink, marginBottom: 8,
          }}
        />
        <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 8 }}>
          <Btn kind="secondary" full disabled={!ble?.connected || !Number.isFinite(calLiveCm)} onClick={calibrateSensor}>
            Calibrar
          </Btn>
          <Btn kind="tertiary" full disabled={!ble?.connected} onClick={clearCalibration}>
            Remover calibração
          </Btn>
        </div>
        <div style={{ fontSize: 12, marginTop: 10, color: calInfo?.error ? (T.red || "#da1e28") : T.inkSubtle }}>
          {calInfo?.error
            ? (CAL_ERROR_TEXT[calInfo.error] || `Erro na calibração: ${calInfo.error}`)
            : calInfo
              ? (calInfo.factor < 1
                  ? `Calibrado: fator ${calInfo.factor.toFixed(4)} · inclinação ${calInfo.angle.toFixed(1)}°`
                  : "Sem correção ativa (fator 1,0000).")
              : (ble?.connected ? "Consultando calibração…" : "Conecte um sensor para calibrar.")}
        </div>
      </Tile>

      <Tile padding={16}>
        <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 12 }}>Unidades e exibição</div>
        <div style={{ fontSize: 13, color: T.inkSubtle, marginBottom: 6 }}>Velocidade</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
          {VELOCITY_UNITS.map(u => (
            <button key={u.id} onClick={() => setVelocityUnitId?.(u.id)} style={{
              padding: "8px 12px", fontSize: 13, fontFamily: T.mono,
              background: velocityUnitId === u.id ? T.blue : T.surface1,
              color: velocityUnitId === u.id ? "#fff" : T.ink,
              border: `1px solid ${velocityUnitId === u.id ? T.blue : T.hairlineStrong}`,
            }}>{u.label}</button>
          ))}
        </div>
        <div style={{ fontSize: 13, color: T.inkSubtle, marginBottom: 6 }}>Vazão</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
          {FLOW_UNITS.map(u => (
            <button key={u.id} onClick={() => setFlowUnitId?.(u.id)} style={{
              padding: "8px 12px", fontSize: 13, fontFamily: T.mono,
              background: flowUnitId === u.id ? T.blue : T.surface1,
              color: flowUnitId === u.id ? "#fff" : T.ink,
              border: `1px solid ${flowUnitId === u.id ? T.blue : T.hairlineStrong}`,
            }}>{u.label}</button>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13 }}>Velocidade mínima para exibir</div>
            <div style={{ fontSize: 11, color: T.inkTertiary }}>
              Abaixo disso é ruído: nada aparece nem entra no gráfico (m/min).
            </div>
          </div>
          <input
            value={minVelText}
            onChange={e => {
              setMinVelText(e.target.value);
              const v = parseFloat(String(e.target.value).replace(",", "."));
              if (Number.isFinite(v) && v >= 0 && v <= 10) setMinVelocity?.(v);
            }}
            inputMode="decimal"
            style={{
              width: 84, height: 40, padding: "0 10px", background: T.surface1,
              border: "none", borderBottom: `1px solid ${T.hairlineStrong}`,
              fontSize: 14, fontFamily: T.mono, color: T.ink, textAlign: "right",
            }}
          />
        </div>
      </Tile>

      <Tile data-requires-sensor="true" padding={16}>
        <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 12 }}>Detecção de lavagem</div>
        <div style={{ fontSize: 13, color: T.inkSubtle, marginBottom: 12 }}>
          Fatores da detecção no sensor (desvio que abre a lavagem, estabilidade que encerra, agregação de eventos por vazão, trava entre lavagens). Os valores ficam salvos no sensor.
        </div>
        {!washCfg || !washCfg.items?.length ? (
          <Btn kind="tertiary" full disabled={!ble?.connected} onClick={() => ble?.sendCommand?.("CFG:GET")}>
            Carregar configuração
          </Btn>
        ) : (
          <>
            {washCfg.items.map(item => {
              const editing = cfgEdits[item.key] !== undefined;
              const shown = editing ? cfgEdits[item.key] : String(item.val);
              const changed = editing && String(item.val) !== String(cfgEdits[item.key]).trim();
              return (
                <div key={item.key} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderBottom: `1px solid ${T.hairline}` }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13 }}>{item.desc}</div>
                    <div style={{ fontSize: 11, color: T.inkTertiary, fontFamily: T.mono }}>
                      {item.key} · {item.min}–{item.max} · padrão {item.def}
                    </div>
                  </div>
                  <input
                    value={shown}
                    onChange={e => setCfgEdits(ed => ({ ...ed, [item.key]: e.target.value }))}
                    inputMode="numeric"
                    style={{
                      width: 84, height: 40, padding: "0 10px", background: T.surface1,
                      border: "none", borderBottom: `1px solid ${T.hairlineStrong}`,
                      fontSize: 14, fontFamily: T.mono, color: T.ink, textAlign: "right",
                    }}
                  />
                  {changed && (
                    <button onClick={() => cfgSave(item)} style={{ fontSize: 13, color: T.blue, padding: "6px 8px", flexShrink: 0 }}>
                      Salvar
                    </button>
                  )}
                </div>
              );
            })}
            <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
              <Btn kind="tertiary" disabled={!ble?.connected} onClick={() => ble?.sendCommand?.("CFG:GET")}>Recarregar</Btn>
              <Btn kind="tertiary" disabled={!ble?.connected} onClick={cfgReset}>Restaurar padrões</Btn>
            </div>
            <div style={{ fontSize: 12, marginTop: 10, color: washCfg.error ? (T.red || "#da1e28") : T.inkSubtle }}>
              {washCfg.error
                ? `Erro: ${washCfg.error}`
                : washCfg.savedKey
                  ? `"${washCfg.savedKey}" salvo no sensor.`
                  : (washCfg.loaded ? "Configuração carregada do sensor." : "Carregando…")}
            </div>
          </>
        )}
      </Tile>

      <Tile data-requires-sensor="true" padding={16}>
        <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 12 }}>Firmware</div>
        <div style={{ fontSize: 13, color: T.inkSubtle, marginBottom: 12 }}>
          Atualização OTA via Bluetooth (arquivo .bin do build).
        </div>
        {otaBusy ? (
          <div>
            <div style={{ height: 8, background: T.surface1, overflow: "hidden", marginBottom: 8 }}>
              <div style={{ height: "100%", width: `${otaPct}%`, background: T.blue, transition: "width .3s" }} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
              <span style={{ fontSize: 13, color: T.inkSubtle }}>
                {ota.status === "transferring" && ota.total > 0
                  ? `Enviando… ${otaPct}% (${Math.round(ota.sent / 1024)} / ${Math.round(ota.total / 1024)} KB)`
                  : (ota.message || "Preparando…")}
              </span>
              <button onClick={() => ble?.cancelFirmwareUpdate?.()} style={{ fontSize: 13, color: T.red || "#da1e28", flexShrink: 0, padding: "4px 6px" }}>
                Cancelar
              </button>
            </div>
          </div>
        ) : (
          <>
            <Btn kind="secondary" full disabled={!ble?.connected} onClick={startOta}>
              Atualizar firmware (.bin)
            </Btn>
            {ota.message ? (
              <div style={{ fontSize: 12, marginTop: 10, color: ota.status === "error" ? (T.red || "#da1e28") : T.inkSubtle }}>
                {ota.message}
              </div>
            ) : null}
          </>
        )}
      </Tile>

      <Tile padding={16}>
        <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 12 }}>Tutorial</div>
        <div style={{ fontSize: 13, color: T.inkSubtle, marginBottom: 12 }}>
          Refaça o guia interativo nas telas reais do app quando precisar.
        </div>
        <Btn kind="tertiary" full onClick={() => onStartGuide?.()}>Abrir tutorial</Btn>
        <label style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, marginTop: 14, cursor: "pointer" }}>
          <span style={{ fontSize: 13, color: T.inkSubtle }}>Mostrar ao abrir o app</span>
          <input type="checkbox" checked={!!showGuideOnStartup} onChange={e => onShowGuideOnStartupChange?.(e.target.checked)} style={{ width: 22, height: 22, flexShrink: 0 }} />
        </label>
      </Tile>
      <Tile data-guide="settings-minimal" padding={16}>
        <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 12 }}>Modo simplificado</div>
        <div style={{ fontSize: 13, color: T.inkSubtle, marginBottom: 12 }}>
          Tela única para o filtro fixo de areia (ETA PRIMAVERA): conexão automática, sessões automáticas por lavagem e sincronização em segundo plano.
        </div>
        <Btn kind="secondary" full onClick={() => onEnterMinimal?.()}>Usar modo simplificado</Btn>
      </Tile>

      <Tile padding={16}>
        <label style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, cursor: "pointer" }}>
          <span>
            <span style={{ display: "block", fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase" }}>Modo debug</span>
            <span style={{ display: "block", fontSize: 13, color: T.inkSubtle, marginTop: 4 }}>Distância, raw ESP e processamento interno.</span>
          </span>
          <input type="checkbox" checked={!!debugMode} onChange={e => setDebugMode?.(e.target.checked)} style={{ width: 22, height: 22, flexShrink: 0 }} />
        </label>
      </Tile>

      {debugMode && <DebugPanel ble={ble} debugInfo={debugInfo} />}

      <Tile padding={16}>
        <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 12 }}>Servidor</div>
        <div style={{ fontSize: 13, color: T.inkSubtle, marginBottom: 10 }}>Endpoint para envio das sessões coletadas.</div>
        <input value={url} onChange={e => { setUrl(e.target.value); setSaved(false); }}
          style={{
            width: "100%", height: 48, padding: "0 14px", background: T.surface1,
            border: "none", borderBottom: `1px solid ${T.hairlineStrong}`,
            outline: "none", fontSize: 15, fontFamily: T.mono,
          }} />
        <div style={{ marginTop: 12 }}>
          <Btn kind={saved ? "ghost" : "primary"} onClick={save} disabled={saved}>
            {saved ? "✓ Salvo" : "Salvar URL"}
          </Btn>
        </div>
      </Tile>

      <Tile padding={16}>
        <div style={{ fontSize: 12, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 14 }}>Sobre</div>
        {[
          { k: "Versão", v: "2.0.0" },
          { k: "Serviço BLE", v: "0x00FF / 0xFF01+0xFF02", mono: true },
          { k: "Schema", v: "v3", mono: true },
        ].map(({ k, v, mono }, i, arr) => (
          <div key={k} style={{
            display: "flex", justifyContent: "space-between", alignItems: "center",
            padding: "12px 0", borderBottom: i < arr.length - 1 ? `1px solid ${T.hairline}` : "none",
          }}>
            <span style={{ fontSize: 14, color: T.inkMuted }}>{k}</span>
            <span style={{ fontSize: 14, fontFamily: mono ? T.mono : "inherit" }}>{v}</span>
          </div>
        ))}
      </Tile>
    </div>
    <ConfirmDialog action={confirmAction} onCancel={() => setConfirmAction(null)} onConfirm={runConfirmedAction} />
    </>
  );
}

  { eyebrow: "Guia · 9 de 13", title: "Abra o analisador CSV", body: "Toque no botão CSV destacado no canto inferior direito. Ele funciona offline e abrirá dados de exemplo.", target: "native-csv", requireTargetTap: true },
];

function InitialGuide({ step, onNext, onSkip }) {
  const item = Number.isInteger(step) ? INITIAL_GUIDE_STEPS[step] : null;
  const [targetRect, setTargetRect] = useState(null);
  const [confirmExit, setConfirmExit] = useState(false);
  const [showNextTime, setShowNextTime] = useState(false);
  useEffect(() => { setConfirmExit(false); }, [step]);
  useEffect(() => {
    if (!item?.target) { setTargetRect(null); return; }
    let cancelled = false;
    const locate = () => {
      if (cancelled) return;
      if (item.target === "native-csv") {
        setTargetRect({ left: window.innerWidth - 70, top: window.innerHeight - 188, width: 60, height: 60, right: window.innerWidth - 10, bottom: window.innerHeight - 128 });
        return;
      }
      const node = document.querySelector(`[data-guide="${item.target}"]`);
      if (!node) { setTargetRect(null); return; }
      const rect = node.getBoundingClientRect();
      setTargetRect({ left: rect.left - 5, top: rect.top - 5, width: rect.width + 10, height: rect.height + 10, right: rect.right + 5, bottom: rect.bottom + 5 });
    };
    const node = document.querySelector(`[data-guide="${item.target}"]`);
    node?.scrollIntoView({ behavior: "smooth", block: "center" });
    const timer = setTimeout(locate, 180);
    window.addEventListener("resize", locate);
    window.addEventListener("scroll", locate, true);
    return () => { cancelled = true; clearTimeout(timer); window.removeEventListener("resize", locate); window.removeEventListener("scroll", locate, true); };
  }, [step, item?.target]);
  if (!item) return null;

  const gap = 8;
  const r = targetRect;
  const blockers = r ? [
    { left: 0, top: 0, right: 0, height: Math.max(0, r.top) },
    { left: 0, top: r.top, width: Math.max(0, r.left), height: r.height },
    { left: r.right, top: r.top, right: 0, height: r.height },
    { left: 0, top: r.bottom, right: 0, bottom: 0 },
  ] : [{ inset: 0 }];
  const cardPosition = r
    ? (r.top > window.innerHeight / 2
      ? { bottom: Math.max(12, window.innerHeight - r.top + gap) }
      : { top: Math.min(window.innerHeight - 230, r.bottom + gap) })
    : { bottom: 16 };

  return (
    <div role="dialog" aria-modal="true" aria-labelledby="initial-guide-title" style={{ position: "fixed", inset: 0, zIndex: 10000, pointerEvents: "none" }}>
      {blockers.map((style, index) => <div key={index} style={{ position: "fixed", background: "rgba(8,12,20,.58)", pointerEvents: "auto", ...style }} />)}
      {r && <div style={{ position: "fixed", left: r.left, top: r.top, width: r.width, height: r.height, border: `3px solid ${T.blue}`, boxShadow: `0 0 0 4px ${T.blue}44`, zIndex: 10001, pointerEvents: "none", animation: "pulse 1.3s ease-in-out infinite" }} />}
      <div style={{ position: "fixed", left: 12, right: 12, maxWidth: 520, margin: "0 auto", zIndex: 10002, pointerEvents: "auto", ...cardPosition }}>
        <div style={{ background: T.canvas, borderTop: `4px solid ${T.blue}`, padding: 18, boxShadow: "0 12px 36px rgba(0,0,0,.32)" }}>
          <div style={{ color: T.blue, fontSize: 12, fontWeight: 700, letterSpacing: ".08em", textTransform: "uppercase" }}>{item.eyebrow}</div>
          <div id="initial-guide-title" style={{ fontSize: 20, fontWeight: 600, margin: "6px 0" }}>{confirmExit ? "Sair do guia?" : item.title}</div>
          {confirmExit ? (
            <>
              <div style={{ fontSize: 14, color: T.inkMuted }}>Você pode reabrir o tutorial em Ajustes a qualquer momento.</div>
              <label style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 14, fontSize: 14 }}>
                <input type="checkbox" checked={showNextTime} onChange={e => setShowNextTime(e.target.checked)} style={{ width: 20, height: 20 }} />
                Mostrar novamente na próxima abertura
              </label>
              <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                <Btn kind="tertiary" full onClick={() => setConfirmExit(false)}>Continuar guia</Btn>
                <Btn full onClick={() => onSkip(showNextTime)}>Sair</Btn>
              </div>
            </>
          ) : (
            <>
              <div style={{ fontSize: 14, lineHeight: 1.45, color: T.ink }}>{item.body}</div>
              {item.requireTargetTap && <div style={{ marginTop: 10, color: T.blue, fontSize: 13, fontWeight: 600 }}>Toque na área destacada para continuar.</div>}
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 14 }}>
                <button onClick={() => setConfirmExit(true)} style={{ minHeight: 42, padding: "0 6px", color: T.inkSubtle, textDecoration: "underline" }}>Sair</button>
                {!item.requireTargetTap && <Btn full onClick={onNext}>{item.next}</Btn>}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function MinimalScreen({ ble, filter, flowVelocity, flowInstant, flowHistory, flowReason, flowWaitSeconds, recentSessions, washActive, washEvents, flowStats, velocityUnit, flowUnit, onOpenFull, onDisconnect }) {
  const connected = !!ble.connected;
  const vu = velocityUnit || VELOCITY_UNITS[0];
  const fu = flowUnit || FLOW_UNITS[0];
  const hasVelocity = Number.isFinite(flowVelocity);
  const hasFlow = hasVelocity && Number.isFinite(flowInstant);
  const collecting = !hasVelocity && Number(flowWaitSeconds) > 0;
  const velocityClass = classifyFlow(flowVelocity);
  const flowClass = classifyFlow(flowInstant);
  const [openSession, setOpenSession] = useState(null);
  const chartHistory = useMemo(() =>
    (flowHistory || []).filter(p => Number.isFinite(p.velocityMpm))
      .map(p => ({ ts: p.ts, velocityMpm: Math.abs(p.velocityMpm) * vu.factor })),
    [flowHistory, vu]);
  const statusText = collecting
    ? `Coletando dados (${Math.max(0, Math.ceil(Number(flowWaitSeconds)))}s)`
    : String(flowReason || "Aguardando dados.").trim();
  const metricValueStyle = { fontFamily: T.mono, fontSize: 68, fontWeight: 400, lineHeight: 1, whiteSpace: "nowrap", letterSpacing: -1 };
  const metricLabelStyle = { fontSize: 13, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase", marginBottom: 12 };
  const chartStats = useMemo(() => {
    if (chartHistory.length < 2) return null;
    const cycles = splitFlowCycles(chartHistory);
    const vs = chartHistory.map(p => Math.abs(p.velocityMpm));
    const cur = cycles[cycles.length - 1];
    return {
      cycles: cycles.length,
      avg: vs.reduce((a, b) => a + b, 0) / vs.length,
      curDurationMs: cur.length > 1 ? cur[cur.length - 1].ts - cur[0].ts : 0,
    };
  }, [chartHistory]);
  const stats5 = flowStats || { max: NaN, min: NaN };
  const openFullLink = (
    <button data-guide="open-full" onClick={onOpenFull} style={{ fontSize: 13, color: T.inkSubtle, padding: 12, textDecoration: "underline", alignSelf: "center" }}>
      Abrir app completo
    </button>
  );
  if (!connected) {
    return (
      <div style={{ width: "100%", height: "100%", display: "flex", flexDirection: "column", background: T.surface1 }}>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 18, padding: 24 }}>
          <CageceLogo height={40} />
          <div style={{ fontSize: 22, fontWeight: 600 }}>FilterTrack</div>
          <Spinner size={28} />
          <div style={{ fontSize: 16, color: T.inkSubtle, textAlign: "center" }}>Procurando sensor…</div>
          <div style={{ fontSize: 13, color: T.inkTertiary, textAlign: "center" }}>
            {ble.errorMsg || "Mantenha o Bluetooth ligado e aproxime-se do sensor."}
          </div>
        </div>
        {openFullLink}
      </div>
    );
  }
  return (
    <div style={{ width: "100%", height: "100%", position: "relative", overflow: "hidden", display: "flex", flexDirection: "column" }}>
    <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column", background: T.surface1, overflow: "auto" }}>
      <div data-guide="minimal-header" style={{ padding: "14px 12px", display: "flex", alignItems: "center", gap: 8, background: T.canvas, borderBottom: `1px solid ${T.hairline}` }}>
        <button onClick={onDisconnect} aria-label="Voltar e desconectar do sensor" title="Desconectar do sensor" style={{ width: 40, height: 40, display: "grid", placeItems: "center", color: T.ink, flexShrink: 0 }}>
          <svg width="20" height="20" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3l-5 5 5 5" stroke="currentColor" strokeWidth="1.5" />
          </svg>
        </button>
        <span style={{ width: 10, height: 10, background: T.success, borderRadius: 10, flexShrink: 0, boxShadow: `0 0 0 4px ${T.success}22` }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontWeight: 500, fontSize: 15 }}>{filter ? filter.station : (ble.deviceName || "Sensor")}</div>
          <div style={{ fontSize: 12, color: T.inkSubtle }}>
            {filter ? `${filter.location} · ${filter.businessUnit} · Área ${formatAreaLabel(filter.areaM2)}` : "Sensor conectado"}
          </div>
        </div>
        <SignalBars rssi={ble.rssi} />
      </div>

      {washActive && (
        <div style={{
          padding: "12px 16px", display: "flex", alignItems: "center", gap: 10,
          background: "#fcf4d6", borderBottom: "1px solid #f1c21b",
        }}>
          <Spinner size={16} />
          <div style={{ flex: 1, fontSize: 14, fontWeight: 500 }}>
            Lavagem em andamento
            {washEvents > 0 && (
              <span style={{ fontWeight: 400, fontSize: 12, color: T.inkSubtle, marginLeft: 8 }}>
                {washEvents} evento{washEvents > 1 ? "s" : ""}
              </span>
            )}
          </div>
        </div>
      )}

      <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 14 }}>
        <div data-guide="minimal-metrics" style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10 }}>
          <Tile padding={20}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <div style={metricLabelStyle}>Velocidade de subida</div>
              {hasVelocity && <Tag tone={velocityClass.tone}>{velocityClass.label}</Tag>}
            </div>
            <div style={metricValueStyle}>
              {hasVelocity ? fmtInUnit(flowVelocity, vu) : "--"}
              <span style={{ fontSize: 18, color: T.inkSubtle, marginLeft: 8, letterSpacing: 0 }}>{vu.label}</span>
            </div>
            {collecting && (
              <div style={{ marginTop: 12, fontSize: 12, color: T.inkSubtle, display: "flex", alignItems: "center", gap: 8 }}>
                <Spinner size={13} /><span>{statusText}</span>
              </div>
            )}
          </Tile>
          <Tile padding={20}>
            <div style={metricLabelStyle}>Vazão</div>
            <div style={{
              ...metricValueStyle,
              color: hasFlow && flowClass.tone === "danger" ? T.danger : hasFlow && flowClass.tone === "success" ? T.success : T.ink,
            }}>
              {hasFlow ? fmtInUnit(flowInstant, fu) : "--"}
              <span style={{ fontSize: 18, color: T.inkSubtle, marginLeft: 8, letterSpacing: 0 }}>{fu.label}</span>
            </div>
            {collecting && (
              <div style={{ marginTop: 12, fontSize: 12, color: T.inkSubtle }}>{statusText}</div>
            )}
          </Tile>
        </div>

        <Tile data-guide="minimal-chart" padding={0} style={{ overflow: "hidden" }}>
          <div style={{ padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${T.hairline}` }}>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Velocidade de subida</div>
            <Tag tone="blue">tempo real</Tag>
          </div>
          <MinimalFlowChart history={chartHistory} />
          {chartStats && (
            <div style={{
              display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8,
              padding: "10px 16px 14px", borderTop: `1px solid ${T.hairline}`,
            }}>
              {[
                ["Média", chartStats.avg.toFixed(vu.dec)],
                ["Máx", fmtInUnit(stats5.max, vu)],
                ["Mín", fmtInUnit(stats5.min, vu)],
                ["Duração", chartStats.curDurationMs > 0 ? formatDuration(chartStats.curDurationMs) : "--"],
              ].map(([label, value]) => (
                <div key={label}>
                  <div style={{ fontSize: 10, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase" }}>{label}</div>
                  <div style={{ fontFamily: T.mono, fontSize: 14, marginTop: 2 }}>{value}</div>
                </div>
              ))}
            </div>
          )}
        </Tile>

        {recentSessions && recentSessions.length > 0 && (
          <Tile padding={0} style={{ overflow: "hidden" }}>
            <div style={{ padding: "14px 16px", fontSize: 14, fontWeight: 500, borderBottom: `1px solid ${T.hairline}` }}>
              Últimas medições
            </div>
            {recentSessions.map((s, i) => {
              const v = sessionVelocityMpm(s);
              const area = s.filter ? Number(s.filter.areaM2) : NaN;
              const f = computeFlowFromVelocityLpm(area, v);
              const cls = classifyFlow(f);
              const started = s.startedAt
                ? new Date(s.startedAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
                : "";
              const duration = s.startedAt && s.endedAt ? Date.parse(s.endedAt) - Date.parse(s.startedAt) : NaN;
              return (
                <div key={s.id || i} onClick={() => setOpenSession(s)} style={{
                  padding: "12px 16px", display: "flex", alignItems: "center", gap: 12,
                  borderBottom: i < recentSessions.length - 1 ? `1px solid ${T.hairline}` : "none",
                  cursor: "pointer",
                }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: T.mono, fontSize: 13 }}>{started}</div>
                    <div style={{ fontSize: 12, color: T.inkSubtle }}>{duration > 0 ? formatDuration(duration) : ""}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: T.mono, fontSize: 15 }}>
                      {fmtInUnit(v, vu)}
                      <span style={{ fontSize: 11, color: T.inkSubtle, marginLeft: 3 }}>{vu.label}</span>
                    </div>
                    <div style={{ fontSize: 12, color: cls.tone === "danger" ? T.danger : cls.tone === "success" ? T.success : T.inkSubtle }}>
                      {Number.isFinite(f) ? `${fmtInUnit(f, fu)} ${fu.label}` : ""}
                    </div>
                  </div>
                  <span style={{ color: T.inkTertiary, fontSize: 18, flexShrink: 0 }}>›</span>
                </div>
              );
            })}
          </Tile>
        )}
      </div>
      {openFullLink}
    </div>
    {openSession && (
      <SessionDetailOverlay
        session={openSession}
        velocityUnit={vu}
        flowUnit={fu}
        onClose={() => setOpenSession(null)}
      />
    )}
    </div>
  );
}

/* Detalhe de uma medição arquivada: gráfico reconstruído das amostras,
   estatísticas e os eventos de lavagem registrados no período. */
function SessionDetailOverlay({ session, velocityUnit, flowUnit, onClose }) {
  const vu = velocityUnit, fu = flowUnit;
  const series = useMemo(() => sessionVelocitySeries(session), [session]);
  const chartSeries = useMemo(
    () => series.map(p => ({ ts: p.ts, velocityMpm: Math.abs(p.velocityMpm) * vu.factor })),
    [series, vu]);
  const area = session?.filter ? Number(session.filter.areaM2) : NaN;
  const stats = useMemo(() => {
    const vs = series.map(p => Math.abs(p.velocityMpm)).filter(Number.isFinite);
    if (!vs.length) return null;
    return {
      avg: vs.reduce((a, b) => a + b, 0) / vs.length,
      max: Math.max(...vs),
      min: Math.min(...vs),
    };
  }, [series]);
  const startMs = Date.parse(session?.startedAt || "") || 0;
  const endMs = Date.parse(session?.endedAt || "") || startMs;
  const washEntries = useMemo(() => {
    const all = loadJson(STORAGE.washLog, []);
    if (!Array.isArray(all) || !startMs) return [];
    const lo = startMs - 60000, hi = endMs + 45 * 60000;
    return all.filter(r => {
      const t = Date.parse(r && r.receivedAt || "");
      return Number.isFinite(t) && t >= lo && t <= hi;
    }).slice(-40);
  }, [session, startMs, endMs]);
  const fmtDate = ms => new Date(ms).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const avgFlow = stats ? computeFlowFromVelocityLpm(area, stats.avg) : NaN;
  return (
    <div style={{
      position: "absolute", top: 0, left: 0, right: 0, bottom: 0, zIndex: 60,
      background: T.surface1, display: "flex", flexDirection: "column",
      // A action bar nativa cobre o topo da página (tema overlay); o conteúdo
      // do app começa por baixo dela — o cabeçalho precisa desse recuo.
      paddingTop: 80,
    }}>
      <div style={{ padding: "14px 16px", display: "flex", alignItems: "center", gap: 12, background: T.canvas, borderBottom: `1px solid ${T.hairline}` }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontWeight: 500, fontSize: 15 }}>Medição {startMs ? fmtDate(startMs) : ""}</div>
          <div style={{ fontSize: 12, color: T.inkSubtle }}>
            {endMs > startMs ? `Duração ${formatDuration(endMs - startMs)}` : ""}
            {session?.endReason ? ` · ${session.endReason === "wash_started" || session.endReason === "wash_detected" ? "encerrada por lavagem" : session.endReason}` : ""}
          </div>
        </div>
        <button onClick={onClose} style={{ fontSize: 15, color: T.blue, padding: "8px 10px", flexShrink: 0 }}>Fechar</button>
      </div>
      <div style={{ flex: 1, overflow: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 14 }}>
        <Tile padding={0} style={{ overflow: "hidden" }}>
          <div style={{ padding: "14px 16px", fontSize: 14, fontWeight: 500, borderBottom: `1px solid ${T.hairline}` }}>
            Velocidade de subida ({vu.label})
          </div>
          <MinimalFlowChart history={chartSeries} />
          {stats && (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, padding: "10px 16px 14px", borderTop: `1px solid ${T.hairline}` }}>
              {[
                ["Média", fmtInUnit(stats.avg, vu)],
                ["Máx", fmtInUnit(stats.max, vu)],
                ["Mín", fmtInUnit(stats.min, vu)],
                ["Vazão média", Number.isFinite(avgFlow) ? `${fmtInUnit(avgFlow, fu)} ${fu.label}` : "--"],
              ].map(([label, value]) => (
                <div key={label}>
                  <div style={{ fontSize: 10, color: T.inkMuted, letterSpacing: 0.32, textTransform: "uppercase" }}>{label}</div>
                  <div style={{ fontFamily: T.mono, fontSize: 14, marginTop: 2 }}>{value}</div>
                </div>
              ))}
            </div>
          )}
        </Tile>

        <Tile padding={0} style={{ overflow: "hidden" }}>
          <div style={{ padding: "14px 16px", fontSize: 14, fontWeight: 500, borderBottom: `1px solid ${T.hairline}` }}>
            Eventos registrados
          </div>
          {washEntries.length === 0 && (
            <div style={{ padding: 16, fontSize: 13, color: T.inkSubtle }}>
              Nenhum evento de lavagem no período desta medição.
            </div>
          )}
          {washEntries.map((r, i) => {
            const isWash = Number(r.type) !== 1;
            const rateMpm = Number(r.aux) / 1000;   // mm/min → m/min
            return (
              <div key={i} style={{
                padding: "12px 16px",
                borderBottom: i < washEntries.length - 1 ? `1px solid ${T.hairline}` : "none",
              }}>
                <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                  <span style={{ fontSize: 13, fontWeight: 500 }}>
                    {isWash ? "Lavagem" : "Evento"}
                  </span>
                  <span style={{ fontSize: 12, color: T.inkSubtle, fontFamily: T.mono }}>
                    {r.receivedAt ? fmtDate(Date.parse(r.receivedAt)) : ""}
                  </span>
                </div>
                <div style={{ fontSize: 12, color: T.inkSubtle, marginTop: 4, fontFamily: T.mono }}>
                  {isWash
                    ? `nível ${(Number(r.beforeMm) / 10).toFixed(1)} → ${(Number(r.afterMm) / 10).toFixed(1)} cm` +
                      (Number.isFinite(Number(r.events)) && Number(r.events) > 0 ? ` · ${r.events} evento(s)` :
                       Number.isFinite(Number(r.count)) && Number(r.count) > 0 ? ` · ${r.count} evento(s)` : "") +
                      (Number.isFinite(Number(r.aux)) && Number(r.aux) > 0 ? ` · ${formatDuration(Number(r.aux) * 1000)}` : "")
                    : `nível ${(Number(r.beforeMm) / 10).toFixed(1)}–${(Number(r.afterMm) / 10).toFixed(1)} cm` +
                      ` · ${fmtInUnit(rateMpm, vu)} ${vu.label}` +
                      (Number.isFinite(Number(r.count)) ? ` · ${r.count} movimento(s)` : "")}
                </div>
              </div>
            );
          })}
        </Tile>
      </div>
    </div>
  );
}

function App() {
  const ble = useBLE();

  const [filters, setFilters] = useState(() => mergeDefaultFilters(loadJson(STORAGE.filters, [])));
  const [selectedFilterId, setSelectedFilterId] = useState(() => loadText(STORAGE.selectedFilterId, ""));
  const [knownDevices, setKnownDevices] = useState(() => { const l = loadJson(STORAGE.knownDevices, []); return Array.isArray(l) ? l : []; });
  const [serverUrl, setServerUrl] = useState(() => {
    const s = loadText(STORAGE.serverUrl, DEFAULT_SERVER_URL).trim();
    if (!s || s === LEGACY_LOCAL_SERVER_URL) return DEFAULT_SERVER_URL;
    return s;
  });
  const [tab, setTab] = useState("monitor");
  const [picking, setPicking] = useState(false);
  const [flowHistory, setFlowHistory] = useState([]);
  const [flowInstant, setFlowInstant] = useState(NaN);
  const [flowVelocity, setFlowVelocity] = useState(NaN);
  const [flowReason, setFlowReason] = useState("Aguardando janela de 10s.");
  const [flowWaitSeconds, setFlowWaitSeconds] = useState(10);
  const [debugMode, setDebugMode] = useState(() => loadText(STORAGE.debugMode, "") === "1");
  const [velocityUnitId, setVelocityUnitId] = useState(() => loadText(STORAGE.velocityUnit, "m_min"));
  const [flowUnitId, setFlowUnitId] = useState(() => loadText(STORAGE.flowUnit, "l_min"));
  const [minVelocity, setMinVelocity] = useState(() => {
    const v = parseFloat(loadText(STORAGE.minVelocity, "0.25"));
    return Number.isFinite(v) && v >= 0 ? v : 0.25;
  });
  const minVelocityRef = useRef(minVelocity);
  useEffect(() => { minVelocityRef.current = minVelocity; saveText(STORAGE.minVelocity, String(minVelocity)); }, [minVelocity]);
  useEffect(() => { saveText(STORAGE.velocityUnit, velocityUnitId); }, [velocityUnitId]);
  useEffect(() => { saveText(STORAGE.flowUnit, flowUnitId); }, [flowUnitId]);
  const velocityUnit = unitById(VELOCITY_UNITS, velocityUnitId);
  const flowUnit = unitById(FLOW_UNITS, flowUnitId);
  const [debugInfo, setDebugInfo] = useState({});
  const [activeSessionMeta, setActiveSessionMeta] = useState(null);
  const [syncState, setSyncState] = useState(() => ({
    status: "idle", pendingCount: readPendingSessions().length,
    message: "", lastSuccessAt: loadText(STORAGE.lastSyncAt, ""),
  }));
  const [pendingFilterChoice, setPendingFilterChoice] = useState(false);
  const [scanPaused, setScanPaused] = useState(false);
  const [connectionIssue, setConnectionIssue] = useState(null);
  const [offlineBrowseMode, setOfflineBrowseMode] = useState(false);
  const [sensorWarning, setSensorWarning] = useState(false);
  const [minimalMode, setMinimalMode] = useState(() => loadText(STORAGE.minimalMode, "1") === "1");
  const [guideStep, setGuideStep] = useState(() => new URLSearchParams(location.search).get("guide") === "1" ? 0 : null);
  const [showGuideOnStartup, setShowGuideOnStartup] = useState(() => new URLSearchParams(location.search).get("guideOnStartup") === "1");

  const selectedFilter = useMemo(() => filters.find(f => f.id === selectedFilterId) || null, [filters, selectedFilterId]);
  const minimalFilter = useMemo(() =>
    filters.find(f => f.id === MINIMAL_FILTER_ID) || filters.find(MINIMAL_FILTER_MATCH) || null,
    [filters]);
  // Minimal mode always operates on the fixed Primavera Asc filter; the full
  // app keeps whatever the user selected.
  const effectiveFilter = minimalMode ? (minimalFilter || selectedFilter) : selectedFilter;
  const knownDeviceMap = useMemo(() => {
    const map = {};
    (Array.isArray(knownDevices) ? knownDevices : []).forEach(d => {
      const address = normalizeDeviceAddress(d && d.address);
      if (address) map[address] = d;
    });
    return map;
  }, [knownDevices]);
  const autoConnectDevice = useMemo(() => {
    const devices = Array.isArray(ble.devices) ? ble.devices : [];
    const v3Count = devices.filter(isFilterTrackV3Device).length;
    if (v3Count > 1) return null;
    return devices.find(d => isKnownDevice(d, knownDeviceMap)) || null;
  }, [ble.devices, knownDeviceMap]);
  const manualDeviceChoice = useMemo(() => {
    const devices = Array.isArray(ble.devices) ? ble.devices : [];
