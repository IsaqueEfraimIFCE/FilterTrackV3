        setFlowWaitSeconds(0);
        setFlowReason("Sem filtração ativa.");
        lastValidVelocityRef.current = { value: NaN, ts: now };
      } else if (now - lastInstantUpdateRef.current >= 10000) {
        const currentVelocitySign = Math.sign(velocityMpm);
        let flowInverted = false;
        if (lastWindowVelocitySignRef.current !== null && lastWindowVelocitySignRef.current !== 0 && currentVelocitySign !== 0) {
          flowInverted = lastWindowVelocitySignRef.current !== currentVelocitySign;
        }
        if (flowInverted) {
          setFlowHistory([{ ts: now, velocityMpm: round(velocityMpm, 4), flow10 }]);
          setFlowWaitSeconds(10);
          flowWindowStartMsRef.current = now;
        } else {
          setFlowHistory(prev => [...prev, { ts: now, velocityMpm: round(velocityMpm, 4), flow10 }]);
          setFlowWaitSeconds(0);
        }
        lastWindowVelocitySignRef.current = currentVelocitySign;
        setFlowVelocity(velocityMpm);
        setFlowInstant(flow10);
        setFlowReason(motionReason);
        lastValidVelocityRef.current = { value: velocityMpm, ts: now };
        lastAboveThreshRef.current = { velocityMpm, flow10 };
        lastInstantUpdateRef.current = now;
      }
      setDebugInfo({
        ...rawDebug,
        filteredDistance: round(filtered, 3),
        recentCount: recent.length,
        rawCount: raw.length,
        bufferCount: buf.length,
        motionCm: Number.isFinite(motion.motionCm) ? round(motion.motionCm, 4) : NaN,
        velocityMpm: Number.isFinite(velocityMpm) ? round(velocityMpm, 6) : NaN,
        flow10: Number.isFinite(flow10) ? round(flow10, 4) : NaN,
        reason: motionReason,
        lastProcessedAt: now,
      });
    };
    const id = setInterval(tick, 1000); return () => clearInterval(id);
  }, []);

  useEffect(() => {
    const onBU = () => persistActiveSession(true);
    window.addEventListener("beforeunload", onBU); return () => window.removeEventListener("beforeunload", onBU);
  }, [persistActiveSession]);

  // ── Minimal mode: firmware control messages ──────────────────────────
  // Sand mode is enforced (command 5) and the firmware wash log is pulled
  // and acknowledged silently. Wash events close the current session and
  // open the next one, so sessions follow the firmware's wash detection.
  useEffect(() => {
    const log = Array.isArray(ble.controlLog) ? ble.controlLog : [];
    const fresh = log.filter(e => e && e.seq > lastControlSeqRef.current);
    if (!fresh.length) return;
    lastControlSeqRef.current = fresh[fresh.length - 1].seq;
    const sync = washSyncRef.current;
    fresh.forEach(({ msg }) => {
      if (msg.startsWith("SAND=")) {
        if (minimalModeRef.current && msg === "SAND=0" && bleRef.current.connected) {
          const now = Date.now();
          if (now - lastSandCmdRef.current > SAND_MODE_REASSERT_MS) {
            lastSandCmdRef.current = now;
            bleRef.current.sendCommand?.("5");
          }
        }
        return;
      }
      if (msg === "WL=WSTART") {
        // Desvio do baseline detectado: o processo de filtração atual acabou.
        // A sessão fecha aqui; a próxima abre quando a lavagem terminar (WL=EVT).
        setWashActive(true);
        washActiveRef.current = true;
        setWashEventCount(0);
        if (minimalModeRef.current) {
          finalizeSession("wash_started");
          // O gráfico recomeça aqui e acompanha a lavagem inteira; os
          // medidores seguram o último valor acima do limite em vez dos
          // traços que o finalizeSession deixaria.
          const held = lastAboveThreshRef.current;
          setFlowVelocity(Number.isFinite(held.velocityMpm) ? held.velocityMpm : 0);
          setFlowInstant(held.flow10);
          setFlowWaitSeconds(0);
          setFlowReason("Lavagem em andamento.");
        }
        return;
      }
      if (msg.startsWith("WL=WEVT,")) {
        // Evento agregado gravado durante a lavagem (min,max,vazão,excursões).
        setWashEventCount(c => c + 1);
        return;
      }
      if (msg.startsWith("WL=EVT,")) {
        const p = msg.slice(7).split(",");
        appendWashLog([{
          boot: -1, uptimeS: -1, type: 0,
          beforeMm: Number(p[0]), afterMm: Number(p[1]),
          events: Number(p[2]) || 0, receivedAt: nowIso(), live: true,
        }]);
        setWashActive(false);
        washActiveRef.current = false;
        if (minimalModeRef.current) {
          finalizeSession("wash_detected");
          if (bleRef.current.connected) startNewSession();
        }
        return;
      }
      if (msg.startsWith("WL=CNT,")) {
        const n = Number(msg.slice(7).split(",")[0]) || 0;
        if (sync.phase === "count") {
          if (n > 0) { sync.phase = "reading"; sync.records = []; bleRef.current.sendCommand?.("LOG:READ"); }
          else sync.phase = "idle";
        }
        // While "reading", the dump re-announces the count — nothing to do.
        return;
      }
      if (msg.startsWith("WL=R,")) {
        if (sync.phase === "reading") {
          const p = msg.slice(5).split(",");
          if (p.length >= 7) {
            // v2: boot,uptime,type,a,b,count,aux (type 0=lavagem, 1=evento)
            sync.records.push({
              boot: Number(p[0]), uptimeS: Number(p[1]), type: Number(p[2]),
              beforeMm: Number(p[3]), afterMm: Number(p[4]),
              count: Number(p[5]), aux: Number(p[6]), receivedAt: nowIso(),
            });
          } else if (p.length >= 4) {
            sync.records.push({ boot: Number(p[0]), uptimeS: Number(p[1]), type: 0, beforeMm: Number(p[2]), afterMm: Number(p[3]), receivedAt: nowIso() });
          }
        }
        return;
      }
      if (msg === "WL=END") {
        if (sync.phase === "reading") {
          appendWashLog(sync.records);
          sync.phase = "ack";
          bleRef.current.sendCommand?.(`LOG:ACK:${sync.records.length}`);
        }
        return;
      }
      if (msg === "WL=CLR" || msg.startsWith("WL=ERR")) {
        sync.phase = "idle";
        sync.records = [];
      }
    });
  }, [ble.controlLog, finalizeSession, startNewSession]);

  useEffect(() => {
    // Segurança: o firmware encerra a lavagem à força em 30 min; se o WL=EVT
    // se perder (desconexão), o banner não pode ficar preso.
    if (!washActive) return;
    const t = setTimeout(() => setWashActive(false), 35 * 60 * 1000);
    return () => clearTimeout(t);
  }, [washActive]);

  useEffect(() => {
    if (!ble.connected) setWashActive(false);
  }, [ble.connected]);

  useEffect(() => {
    if (!minimalMode || !ble.connected) return;
    washSyncRef.current = { phase: "idle", records: [] };
    const sandTimer = setTimeout(() => {
      if (!bleRef.current.connected) return;
      lastSandCmdRef.current = Date.now();
      bleRef.current.sendCommand?.("5");
    }, 1500);
    const logTimer = setTimeout(() => {
      if (!bleRef.current.connected || washSyncRef.current.phase !== "idle") return;
      washSyncRef.current.phase = "count";
      bleRef.current.sendCommand?.("LOG:COUNT");
    }, 4000);
    return () => { clearTimeout(sandTimer); clearTimeout(logTimer); };
  }, [minimalMode, ble.connected]);

  const minimalRecentSessions = useMemo(() => {
    if (!minimalMode || !effectiveFilter) return [];
    const a = loadJson(STORAGE.sessionArchive, []);
    const list = Array.isArray(a) ? a : [];
    const sameFilter = s => s && s.filter && (
      s.filter.id === effectiveFilter.id ||
      (s.filter.station === effectiveFilter.station && s.filter.name === effectiveFilter.name)
    );
    return list.filter(sameFilter).slice(-8).reverse();
  }, [minimalMode, effectiveFilter, syncState, activeSessionMeta]);

  const handleSync = useCallback(() => { syncSessions(serverUrl, setSyncState, "manual"); }, [serverUrl]);
  useEffect(() => {
    if (ble.connected) setOfflineBrowseMode(false);
  }, [ble.connected]);

  const showSensorRequiredWarning = useCallback(() => {
    setSensorWarning(true);
    clearTimeout(sensorWarningTimerRef.current);
    sensorWarningTimerRef.current = setTimeout(() => setSensorWarning(false), 3500);
  }, []);

  const handleSensorOnlyInteraction = useCallback((event) => {
    if (!offlineBrowseMode) return;
    const control = event.target?.closest?.("button,input,select,textarea");
    const target = control?.closest?.('[data-requires-sensor="true"]');
    if (!target) return;
    event.preventDefault();
    event.stopPropagation();
    showSensorRequiredWarning();
  }, [offlineBrowseMode, showSensorRequiredWarning]);

  const enterWithoutSensor = useCallback(() => {
    pauseScan();
    setOfflineBrowseMode(true);
    setTab("monitor");
    setConnectionIssue(null);
  }, [pauseScan]);

  const returnToSensorConnection = useCallback(() => {
    setOfflineBrowseMode(false);
    setScanPaused(false);
    setTimeout(() => requestScan(), 50);
  }, [requestScan]);

  const tabTitle = { monitor: "Monitor", sessions: "Sessões", filters: "Filtros", settings: "Ajustes" };
  const viewBle = offlineBrowseMode ? {
    ...appBle,
    connected: false,
    connectionStatus: "Offline",
    deviceName: "Sem sensor",
    deviceAddress: "Modo de consulta",
    rssi: -100,
  } : appBle;
  const guideFilter = minimalFilter || selectedFilter || filters[0] || null;
  const displayedFilter = guideActive ? guideFilter : selectedFilter;
  const displayedVelocity = guideActive ? 0.84 : flowVelocity;
  const displayedFlow = guideActive ? 2646 : flowInstant;
  const displayedHistory = guideActive ? demoHistory : flowHistory;
  const displayedReason = guideActive ? "Dados simulados para o guia." : flowReason;
  const displayedWait = guideActive ? 0 : flowWaitSeconds;
  const displayedStats = guideActive ? { min: 0.18, max: 0.88 } : flowStats5;

  if (minimalMode) {
    return (
      <>
      <MinimalScreen
        ble={appBle}
        filter={guideActive ? guideFilter : effectiveFilter}
        flowVelocity={displayedVelocity}
        flowInstant={displayedFlow}
        flowHistory={displayedHistory}
        flowReason={displayedReason}
        flowWaitSeconds={displayedWait}
        recentSessions={minimalRecentSessions}
        washActive={washActive}
        washEvents={washEventCount}
        flowStats={displayedStats}
        velocityUnit={velocityUnit}
        flowUnit={flowUnit}
        onOpenFull={openFullMode}
        onDisconnect={appBle.disconnect}
      />
        <InitialGuide step={guideStep} onNext={advanceInitialGuide} onSkip={skipInitialGuide} />
      </>
    );
  }

  if (!appBle.connected && !offlineBrowseMode) {
    return (
      <>
        <ConnectScreen
          ble={appBle}
          autoConnectDevice={autoConnectDevice}
          isPreferredDevice={d => isKnownDevice(d, knownDeviceMap)}
          scanPaused={scanPaused}
          manualDeviceChoice={manualDeviceChoice}
          onEnterWithoutSensor={enterWithoutSensor}
        />
        <ConnectionIssueDialog
          issue={connectionIssue}
          onRestartDevice={handleIssueRestartDevice}
          onWait={waitForReconnect}
          onRestartApp={restartApp}
        />
      </>
    );
  }

  return (
    <>
    <div onPointerDownCapture={handleSensorOnlyInteraction} onClickCapture={handleSensorOnlyInteraction} style={{ width: "100%", height: "100%", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <AppHeader
        title={tabTitle[tab]}
        subtitle={tab === "monitor" && displayedFilter ? displayedFilter.station : "Monitoramento de filtros"}
      />      {offlineBrowseMode && (
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", background: "#fcf4d6", borderBottom: "1px solid #f1c21b", color: "#684e00", flexShrink: 0 }}>
          <span style={{ fontSize: 18, fontWeight: 700 }}>!</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 600 }}>Modo sem sensor</div>
            <div style={{ fontSize: 12 }}>Consulta disponível; medições e comandos estão bloqueados.</div>
          </div>
          <button onClick={returnToSensorConnection} style={{ color: T.blue, fontSize: 13, fontWeight: 600, padding: 6 }}>Conectar</button>
        </div>
      )}
      <div style={{ flex: 1, position: "relative", display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {tab === "monitor" && (
          <MonitorTab
            ble={viewBle} filter={displayedFilter}
            flowVelocity={displayedVelocity} flowInstant={displayedFlow}
            flowHistory={displayedHistory} flowReason={displayedReason}
            flowWaitSeconds={displayedWait}
            activeSessionMeta={activeSessionMeta}
            onPickFilter={() => setPicking(true)}
            onStartSession={handleSessionToggle}
          />
        )}
        {tab === "sessions" && <SessionsTab syncState={syncState} onSync={handleSync} />}
        {tab === "filters" && <FiltersTab filters={filters} onPick={f => { setSelectedFilterId(f.id); setPendingFilterChoice(false); setTab("monitor"); }} />}
        {tab === "settings" && (
          <SettingsTab
            serverUrl={serverUrl} setServerUrl={setServerUrl} ble={viewBle}
            activeSessionMeta={activeSessionMeta}
            onEndSession={(reason, forceSave) => finalizeSession(reason, forceSave)}
            onRestartSensor={restartSensorCommand}
            debugMode={debugMode}
            setDebugMode={setDebugMode}
            debugInfo={debugInfo}
            onEnterMinimal={enterMinimalMode}
            onStartGuide={startInitialGuide}
            showGuideOnStartup={showGuideOnStartup}
            onShowGuideOnStartupChange={changeGuideStartupPreference}
            velocityUnitId={velocityUnitId} setVelocityUnitId={setVelocityUnitId}
            flowUnitId={flowUnitId} setFlowUnitId={setFlowUnitId}
            minVelocity={minVelocity} setMinVelocity={setMinVelocity}
          />
        )}
        {(picking || (tab === "monitor" && ble.connected && pendingFilterChoice)) && (
          <FilterPickerOverlay
            filters={filters} suggestedFilter={selectedFilter}
            onPick={f => { setSelectedFilterId(f.id); setPendingFilterChoice(false); }}
            onClose={() => { setPicking(false); setPendingFilterChoice(false); }}
          />
        )}
      </div>
      <BottomTabs tab={tab} onChange={changeTab} onOpenData={appBle.openBiDashboard} />
      <ConnectionIssueDialog
        issue={connectionIssue}
        onRestartDevice={handleIssueRestartDevice}
        onWait={waitForReconnect}
        onRestartApp={restartApp}
      />
    </div>
    {sensorWarning && (
      <div role="alert" style={{ position: "fixed", left: 16, right: 16, bottom: 82, zIndex: 9000, maxWidth: 520, margin: "0 auto", padding: "14px 16px", background: "#161616", color: "#fff", boxShadow: "0 8px 24px rgba(0,0,0,.3)", fontSize: 14 }}>
        Este recurso precisa de um sensor conectado. Toque em “Conectar” no aviso amarelo.
      </div>
    )}    <InitialGuide step={guideStep} onNext={advanceInitialGuide} onSkip={skipInitialGuide} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
