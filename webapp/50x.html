<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>500 Serviço indisponível · FilterTrack</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root { --blue: #0068B4; --blue-hover: #0058a0; --blue-10: #e6f0f9; --ink: #161616; --ink-muted: #525252;
  --ink-subtle: #6f6f6f; --canvas: #ffffff; --surface: #f4f4f4; --hairline: #e0e0e0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; background: var(--surface); color: var(--ink);
  font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; }
body { display: flex; flex-direction: column; min-height: 100vh; }
.top { height: 48px; background: #161616; color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-weight: 600; font-size: 14px; }
main { flex: 1; display: grid; place-items: center; padding: 32px 16px; }
.card { width: 100%; max-width: 520px; background: var(--canvas); border: 1px solid var(--hairline); padding: 32px; }
.code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 72px; line-height: 1; letter-spacing: -2px; color: var(--blue); }
h1 { font-size: 24px; font-weight: 600; margin: 16px 0 8px; }
p { color: var(--ink-muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; font: inherit;
  font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid var(--blue); cursor: pointer; }
.primary { background: var(--blue); color: #fff; } .primary:hover { background: var(--blue-hover); }
.ghost { background: transparent; color: var(--blue); } .ghost:hover { background: var(--blue-10); }
footer { padding: 16px; text-align: center; font-size: 12px; color: var(--ink-subtle); }
@media (max-width: 480px) { .card { padding: 24px 16px; } .code { font-size: 56px; } .btn { flex: 1 1 100%; } }
</style>
</head>
<body>
<header class="top"><svg width="20" height="20" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="#0068B4"/><path d="M20 8 C 14 18, 11 24, 11 28 a 9 9 0 0 0 18 0 c 0 -4 -3 -10 -9 -20 z" fill="#fff"/></svg>FilterTrack</header>
<main>
  <div class="card">
    <div class="code">500</div>
    <h1>Serviço indisponível</h1>
    <p>O servidor teve um problema ao responder. Tente de novo em instantes.</p>
    <div class="actions">
      <button class="btn primary" onclick="location.reload()">Tentar novamente</button>
      <a class="btn ghost" href="https://filtertrack-api.fly.dev/bi">Painel BI</a>
      <a class="btn ghost" href="https://filtertrack-api.fly.dev/health">Status do sistema</a>
    </div>
  </div>
</main>
<footer>FilterTrack · Cagece</footer>
</body>
</html>
