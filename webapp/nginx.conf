server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pages and the bridge change often and Bluefy caches aggressively.
  add_header Cache-Control "no-cache" always;

  # Own error pages instead of nginx's plain ones; the status code is kept.
  error_page 404 /404.html;
  error_page 500 502 503 504 /50x.html;
  location = /404.html { internal; }
  location = /50x.html { internal; }

  # Remote diagnostics sink for bridge.js: the message rides in the query
  # string, so it lands in the access log (visible via `flyctl logs`).
  location = /log {
    access_log /dev/stdout;
    return 204;
  }

  # Android app download offered by the page's install banner. The MIME type
  # is what makes Android hand the file to its package installer.
  location = /FilterTrack.apk {
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition 'attachment; filename="FilterTrack.apk"' always;
    add_header Cache-Control "no-cache" always;
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
