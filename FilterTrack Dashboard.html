<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0e0e12; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; overflow: hidden; }

  /* Tweaks panel */

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Tweaks defaults ──
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "updateSpeed": 1200,
  "alertThreshold": 80,
  "showSparklines": true,
  "accentColor": "blue"
}/*EDITMODE-END*/;

// ── Color tokens ──
const COLORS = {
  bg0: '#080c14',
  bg1: '#0f1420',
  bg2: '#161d2e',
  bg3: '#1e273a',
  border: '#232d42',
  blue: '#0068B4',
  blueLight: '#1a8fd1',
  teal: '#00A878',
  tealLight: '#12c992',
  amber: '#e8a930',
  red: '#e84545',
  text0: '#f0f2f8',
  text1: '#b8bdd0',
  text2: '#6b7490',
  mono: "'DM Mono', monospace",
};

// ── Utility: clamp, lerp ──
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const fmtNum = (n, dec = 1) => n.toFixed(dec);

// ── Simulated BLE data ──
function useBLESimulator(connected, speed) {
  const [data, setData] = useState({
    flow: 12.4, pressure: 2.1, turbidity: 0.8, temp: 22.3,
    chlorine: 0.4, ph: 7.1, filterLife: 68, rssi: -62,
    flowHistory: Array(30).fill(12.4),
  });

  useEffect(() => {
    if (!connected) return;
    const id = setInterval(() => {
      setData(d => {
        const flow = clamp(d.flow + (Math.random() - 0.5) * 1.2, 0, 25);
        const pressure = clamp(d.pressure + (Math.random() - 0.5) * 0.15, 0, 4);
        const turbidity = clamp(d.turbidity + (Math.random() - 0.5) * 0.12, 0, 5);
        const temp = clamp(d.temp + (Math.random() - 0.5) * 0.3, 15, 35);
        const chlorine = clamp(d.chlorine + (Math.random() - 0.5) * 0.05, 0, 1);
        const ph = clamp(d.ph + (Math.random() - 0.5) * 0.08, 6, 9);
        const rssi = clamp(d.rssi + Math.round((Math.random() - 0.5) * 4), -90, -40);
        const flowHistory = [...d.flowHistory.slice(1), flow];
        return { flow, pressure, turbidity, temp, chlorine, ph, filterLife: d.filterLife, rssi, flowHistory };
      });
    }, speed);
    return () => clearInterval(id);
  }, [connected, speed]);

  return data;
}

// ── Arc Gauge ──
function ArcGauge({ value, min, max, label, unit, color, size = 120, warn, danger, decimals = 1 }) {
  const canvasRef = useRef();
  const pct = (value - min) / (max - min);
  const isWarn = warn && value >= warn;
  const isDanger = danger && value >= danger;
  const arcColor = isDanger ? COLORS.red : isWarn ? COLORS.amber : color;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr;
    canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
    ctx.scale(dpr, dpr);
    const cx = size / 2, cy = size / 2, r = size * 0.38;
    const startAngle = Math.PI * 0.75;
    const endAngle = Math.PI * 2.25;
    ctx.clearRect(0, 0, size, size);

    // Track
    ctx.beginPath(); ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.strokeStyle = COLORS.bg3; ctx.lineWidth = size * 0.072; ctx.lineCap = 'round';
    ctx.stroke();

    // Fill
    if (pct > 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, startAngle, startAngle + (endAngle - startAngle) * clamp(pct, 0, 1));
      ctx.strokeStyle = arcColor; ctx.lineWidth = size * 0.072; ctx.lineCap = 'round';
      ctx.stroke();
    }

    // Glow
    if (pct > 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, startAngle, startAngle + (endAngle - startAngle) * clamp(pct, 0, 1));
      ctx.strokeStyle = arcColor + '44'; ctx.lineWidth = size * 0.12; ctx.lineCap = 'round';
      ctx.stroke();
    }
  }, [value, size, arcColor, pct]);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', position: 'relative' }}>
      <div style={{ position: 'relative', width: size, height: size }}>
        <canvas ref={canvasRef} />
        <div style={{
          position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', gap: 0,
        }}>
          <span style={{ fontFamily: COLORS.mono, fontSize: size * 0.18, fontWeight: 500, color: arcColor, lineHeight: 1 }}>
            {fmtNum(value, decimals)}
          </span>
          <span style={{ fontSize: size * 0.09, color: COLORS.text2, marginTop: 2 }}>{unit}</span>
        </div>
      </div>
      <span style={{ fontSize: 10, color: COLORS.text2, letterSpacing: '0.08em', textTransform: 'uppercase', marginTop: -size * 0.06 }}>{label}</span>
    </div>
  );
}

// ── Sparkline ──
function Sparkline({ data, color, height = 32, width = 120 }) {
  const canvasRef = useRef();
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr; canvas.height = height * dpr;
    canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);
    if (data.length < 2) return;
    const mn = Math.min(...data), mx = Math.max(...data);
    const range = mx - mn || 1;
    const pts = data.map((v, i) => [i / (data.length - 1) * width, height - ((v - mn) / range) * (height - 4) - 2]);

    // Gradient fill
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, color + '55'); grad.addColorStop(1, color + '00');
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    // Line
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();
  }, [data, color, height, width]);
  return <canvas ref={canvasRef} style={{ display: 'block' }} />;
}

// ── Stat Chip ──
function StatChip({ label, value, unit, color, trend, history, showSpark }) {
  return (
    <div style={{
      background: COLORS.bg2, borderRadius: 12, padding: '10px 12px',
      border: `1px solid ${COLORS.border}`, flex: 1, minWidth: 0,
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <span style={{ fontSize: 9, color: COLORS.text2, letterSpacing: '0.1em', textTransform: 'uppercase' }}>{label}</span>
        {trend && <span style={{ fontSize: 9, color: trend > 0 ? COLORS.teal : COLORS.amber }}>
          {trend > 0 ? '↑' : '↓'}{Math.abs(trend).toFixed(1)}
        </span>}
      </div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 3, marginTop: 4 }}>
        <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 20, fontWeight: 400, color: color || COLORS.text0, lineHeight: 1 }}>{value}</span>
        <span style={{ fontSize: 10, color: COLORS.text2 }}>{unit}</span>
      </div>
      {showSpark && history && <div style={{ marginTop: 6 }}>
        <Sparkline data={history} color={color || COLORS.blue} height={24} width={80} />
      </div>}
    </div>
  );
}

// ── Signal bars ──
function SignalBars({ rssi }) {
  const level = rssi > -55 ? 4 : rssi > -65 ? 3 : rssi > -75 ? 2 : 1;
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 14 }}>
      {[1,2,3,4].map(i => (
        <div key={i} style={{
          width: 3, height: 3 + i * 2.5, borderRadius: 1,
          background: i <= level ? COLORS.teal : COLORS.border,
        }} />
      ))}
    </div>
  );
}

// ── Filter Life Bar ──
function FilterLifeBar({ pct }) {
  const color = pct > 40 ? COLORS.teal : pct > 20 ? COLORS.amber : COLORS.red;
  return (
    <div style={{ background: COLORS.bg2, borderRadius: 12, padding: '10px 14px', border: `1px solid ${COLORS.border}` }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
        <span style={{ fontSize: 10, color: COLORS.text2, letterSpacing: '0.08em', textTransform: 'uppercase' }}>Vida Útil do Filtro</span>
        <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 13, color, fontWeight: 500 }}>{pct}%</span>
      </div>
      <div style={{ height: 6, background: COLORS.bg3, borderRadius: 99, overflow: 'hidden' }}>
        <div style={{
          height: '100%', width: `${pct}%`, borderRadius: 99,
          background: `linear-gradient(90deg, ${color}99, ${color})`,
          transition: 'width 0.6s ease',
          boxShadow: `0 0 8px ${color}88`,
        }} />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6 }}>
        <span style={{ fontSize: 9, color: COLORS.text2 }}>Troca em ~{Math.round(pct * 0.4)} dias</span>
        <span style={{ fontSize: 9, color: pct < 20 ? COLORS.red : COLORS.text2 }}>
          {pct < 20 ? '⚠ Substituição urgente' : pct < 40 ? 'Monitorar' : 'Normal'}
        </span>
      </div>
    </div>
  );
}

// ── Alert Banner ──
function AlertBanner({ alerts }) {
  if (!alerts.length) return null;
  return (
    <div style={{
      background: `${COLORS.red}18`, border: `1px solid ${COLORS.red}44`,
      borderRadius: 10, padding: '8px 12px', display: 'flex', alignItems: 'center', gap: 8,
    }}>
      <div style={{ width: 6, height: 6, borderRadius: 50, background: COLORS.red, flexShrink: 0,
        boxShadow: `0 0 8px ${COLORS.red}` }} />
      <span style={{ fontSize: 11, color: COLORS.red, fontWeight: 500, lineHeight: 1.4 }}>
        {alerts[0]}
      </span>
    </div>
  );
}

// ── Cagece Logo SVG ──
function CageceLogo({ size = 120 }) {
  // Symbol: stylized water drop split into blue + teal halves with wave
  return (
    <svg width={size * 1.6} height={size * 0.55} viewBox="0 0 340 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      {/* Symbol mark — drop shape */}
      <path d="M30 72 C30 52 50 28 60 20 C70 28 90 52 90 72 C90 92 76 106 60 106 C44 106 30 92 30 72Z"
        fill={COLORS.blue} />
      {/* Teal wave overlay on drop */}
      <path d="M30 80 C38 68 52 74 60 70 C68 74 82 68 90 80 C90 92 76 106 60 106 C44 106 30 92 30 80Z"
        fill={COLORS.teal} />
      {/* White highlight dot */}
      <circle cx="50" cy="52" r="5" fill="white" opacity="0.5" />

      {/* CAGECE wordmark */}
      <text x="105" y="68" fontFamily="'Space Grotesk', sans-serif" fontWeight="700"
        fontSize="38" fill={COLORS.blue} letterSpacing="-1">cagece</text>
      {/* Tagline */}
      <text x="105" y="84" fontFamily="'Space Grotesk', sans-serif" fontWeight="400"
        fontSize="9.5" fill={COLORS.text2} letterSpacing="0.3">companhia de água e esgoto do ceará</text>
    </svg>
  );
}

// ── Connect Screen ──
function ConnectScreen({ onConnect, scanning }) {
  return (
    <div style={{
      flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center',
      justifyContent: 'center', padding: '0 28px', gap: 20,
    }}>
      {/* Logos block */}
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16, position: 'relative', width: '100%' }}>
        {/* Glow backdrop */}
        <div style={{
          position: 'absolute', width: 240, height: 160, top: -20,
          background: `radial-gradient(ellipse, ${COLORS.blue}1a 0%, transparent 70%)`,
          pointerEvents: 'none',
        }} />

        {/* Cagece logo — dark version (white text, colored symbol) */}
        <img
          src="assets/logo_cagece_dark.png"
          alt="Cagece"
          style={{ width: 200, height: 'auto', objectFit: 'contain', display: 'block', position: 'relative' }}
        />

        {/* Thin divider */}
        <div style={{ width: '60%', height: 1, background: COLORS.border }} />

        {/* Governo do Ceará horizontal logo */}
        <img
          src="assets/Cor_horiz1_fundo_escuro.png"
          alt="Governo do Ceará"
          style={{ width: 150, height: 'auto', objectFit: 'contain', display: 'block', opacity: 0.9, position: 'relative' }}
        />

        {/* Scanning pulse ring */}
        {scanning && (
          <div style={{
            position: 'absolute', inset: -24, borderRadius: 32,
            border: `1.5px solid ${COLORS.blue}33`,
            animation: 'pulse-ring 1.5s ease-out infinite',
            pointerEvents: 'none',
          }} />
        )}
      </div>

      {/* FilterTrack pill */}
      <div style={{
        background: COLORS.bg2, border: `1px solid ${COLORS.border}`,
        borderRadius: 99, padding: '5px 14px', display: 'flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap',
      }}>
        <div style={{ width: 5, height: 5, borderRadius: 50, background: COLORS.teal, flexShrink: 0 }} />
        <span style={{ fontSize: 11, fontWeight: 600, color: COLORS.text1, letterSpacing: '0.06em', whiteSpace: 'nowrap' }}>
          FilterTrack · Monitor BLE
        </span>
      </div>

      <div style={{ textAlign: 'center' }}>
        <div style={{ fontSize: 12, color: COLORS.text2, lineHeight: 1.6 }}>
          {scanning ? 'Procurando dispositivos BLE próximos...' : 'Conecte ao sensor ESP32 para monitorar o sistema de filtragem em tempo real.'}
        </div>
      </div>

      <button
        onClick={onConnect}
        style={{
          background: scanning ? 'transparent' : COLORS.blue,
          border: `1.5px solid ${COLORS.blue}`,
          color: scanning ? COLORS.blue : '#fff',
          borderRadius: 12, padding: '12px 32px',
          fontSize: 13, fontWeight: 600, letterSpacing: '0.04em',
          cursor: 'pointer', fontFamily: 'inherit',
          transition: 'all 0.2s', whiteSpace: 'nowrap',
        }}
      >
        {scanning ? 'Cancelar Busca' : 'Iniciar Varredura BLE'}
      </button>

      {scanning && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: '100%' }}>
          {['ESP32-FilterSensor-01', 'CAGECE-BLE-003'].map((name, i) => (
            <div
              key={name}
              onClick={() => i === 0 && onConnect(name)}
              style={{
                background: COLORS.bg2, border: `1px solid ${i === 0 ? COLORS.blue + '66' : COLORS.border}`,
                borderRadius: 10, padding: '10px 14px',
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                cursor: i === 0 ? 'pointer' : 'default', opacity: i === 0 ? 1 : 0.4,
                animation: `fade-in 0.3s ease ${i * 0.2}s both`,
              }}
            >
              <div>
                <div style={{ fontSize: 12, color: COLORS.text0, fontWeight: 500 }}>{name}</div>
                <div style={{ fontSize: 10, color: COLORS.text2, marginTop: 2 }}>Filtr. Industrial — RSSI {-55 + i * 12} dBm</div>
              </div>
              {i === 0 && <div style={{ fontSize: 11, color: COLORS.blue, fontWeight: 600 }}>Conectar</div>}
            </div>
          ))}
        </div>
      )}

      <style>{`
        @keyframes pulse-ring { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(1.5);opacity:0} }
        @keyframes fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
      `}</style>
    </div>
  );
}

// ── Main Dashboard ──
function Dashboard({ data, onDisconnect, deviceName, tweaks }) {
  const alerts = [];
  if (data.turbidity > 3) alerts.push('Turbidez elevada: ' + fmtNum(data.turbidity) + ' NTU — verificar pré-filtro');
  if (data.pressure > 3.5) alerts.push('Pressão crítica: ' + fmtNum(data.pressure) + ' bar');
  if (data.filterLife < 20) alerts.push('Filtro com vida útil crítica — substituição necessária');

  const phColor = data.ph < 6.5 || data.ph > 7.5 ? COLORS.amber : COLORS.teal;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: COLORS.bg0 }}>
      {/* Header */}
      <div style={{
        background: COLORS.bg1, borderBottom: `1px solid ${COLORS.border}`,
        padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      }}>
        <div>
          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.text0, letterSpacing: '-0.01em' }}>FilterTrack</div>
          <div style={{ fontSize: 10, color: COLORS.teal, marginTop: 1, display: 'flex', alignItems: 'center', gap: 4 }}>
            <div style={{ width: 5, height: 5, borderRadius: 50, background: COLORS.teal, boxShadow: `0 0 6px ${COLORS.teal}` }} />
            {deviceName}
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <SignalBars rssi={data.rssi} />
          <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: COLORS.text2 }}>{data.rssi} dBm</span>
          <button onClick={onDisconnect} style={{
            background: 'transparent', border: `1px solid ${COLORS.border}`,
            color: COLORS.text2, fontSize: 10, padding: '4px 8px', borderRadius: 6,
            cursor: 'pointer', fontFamily: 'inherit',
          }}>Desconectar</button>
        </div>
      </div>

      {/* Scrollable content */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {/* Alert */}
        <AlertBanner alerts={alerts} />

        {/* Main gauges row */}
        <div style={{
          background: COLORS.bg1, borderRadius: 16, padding: '14px 10px',
          border: `1px solid ${COLORS.border}`,
          display: 'flex', justifyContent: 'space-around', alignItems: 'flex-start',
        }}>
          <ArcGauge value={data.flow} min={0} max={25} label="Vazão" unit="L/min" color={COLORS.blue} size={108} warn={20} danger={23} />
          <div style={{ width: 1, background: COLORS.border, alignSelf: 'stretch', margin: '8px 0' }} />
          <ArcGauge value={data.pressure} min={0} max={4} label="Pressão" unit="bar" color={COLORS.teal} size={108} warn={3} danger={3.5} />
          <div style={{ width: 1, background: COLORS.border, alignSelf: 'stretch', margin: '8px 0' }} />
          <ArcGauge value={data.temp} min={15} max={35} label="Temp." unit="°C" color="#b06ef3" size={108} warn={30} />
        </div>

        {/* Flow sparkline */}
        {tweaks.showSparklines && (
          <div style={{ background: COLORS.bg2, borderRadius: 12, padding: '10px 14px', border: `1px solid ${COLORS.border}` }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8, alignItems: 'baseline' }}>
              <span style={{ fontSize: 10, color: COLORS.text2, letterSpacing: '0.08em', textTransform: 'uppercase' }}>Histórico de Vazão</span>
              <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: COLORS.blue }}>últ. 30s</span>
            </div>
            <Sparkline data={data.flowHistory} color={COLORS.blue} height={36} width={260} />
          </div>
        )}

        {/* Secondary metrics */}
        <div style={{ display: 'flex', gap: 8 }}>
          <StatChip label="Turbidez" value={fmtNum(data.turbidity, 2)} unit="NTU"
            color={data.turbidity > 3 ? COLORS.red : data.turbidity > 1.5 ? COLORS.amber : COLORS.teal}
            history={null} showSpark={false} />
          <StatChip label="Cloro" value={fmtNum(data.chlorine, 2)} unit="mg/L"
            color={data.chlorine < 0.2 ? COLORS.amber : COLORS.teal}
            history={null} showSpark={false} />
          <StatChip label="pH" value={fmtNum(data.ph, 1)} unit="pH"
            color={phColor} history={null} showSpark={false} />
        </div>

        {/* Filter life */}
        <FilterLifeBar pct={data.filterLife} />

        {/* Raw data log */}
        <div style={{ background: COLORS.bg2, borderRadius: 12, padding: '10px 14px', border: `1px solid ${COLORS.border}` }}>
          <div style={{ fontSize: 10, color: COLORS.text2, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 8 }}>
            Stream BLE Raw
          </div>
          <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: COLORS.teal, lineHeight: 1.7, opacity: 0.8 }}>
            <div>{'{'}"flow":{fmtNum(data.flow)},"pres":{fmtNum(data.pressure,2)}{'}'}</div>
            <div>{'{'}"turb":{fmtNum(data.turbidity,3)},"cl":{fmtNum(data.chlorine,3)}{'}'}</div>
            <div>{'{'}"ph":{fmtNum(data.ph,2)},"temp":{fmtNum(data.temp,1)}{'}'}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Root App ──
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [screen, setScreen] = useState('connect'); // 'connect' | 'scanning' | 'dashboard'
  const [deviceName, setDeviceName] = useState('');

  const data = useBLESimulator(screen === 'dashboard', tweaks.updateSpeed);

  // Tweaks protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  const handleConnect = (name) => {
    if (screen === 'connect') {
      setScreen('scanning');
      return;
    }
    if (screen === 'scanning') {
      if (typeof name === 'string') {
        setDeviceName(name);
        setTimeout(() => setScreen('dashboard'), 600);
      } else {
        setScreen('connect');
      }
    }
  };

  const handleDisconnect = () => { setScreen('connect'); };

  // Screen content
  const screenContent = (
    <div style={{ width: '100%', height: '100%', background: COLORS.bg0, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      {screen === 'dashboard'
        ? <Dashboard data={data} onDisconnect={handleDisconnect} deviceName={deviceName} tweaks={tweaks} />
        : <ConnectScreen onConnect={handleConnect} scanning={screen === 'scanning'} />
      }
    </div>
  );

  return (
    <>
      <AndroidDevice statusBarColor={COLORS.bg0} navBarColor={COLORS.bg1}>
        {screenContent}
      </AndroidDevice>

      {/* Tweaks Panel */}
      <div className={`tweaks-panel ${tweaksVisible ? 'visible' : ''}`}>
        <div className="tweaks-title">Tweaks</div>

        <div className="tweak-row">
          <label className="tweak-label">Velocidade de Atualização <span className="tweak-val">{tweaks.updateSpeed}ms</span></label>
          <input type="range" min={400} max={3000} step={200} value={tweaks.updateSpeed}
            onChange={e => updateTweak('updateSpeed', Number(e.target.value))} />
        </div>

        <div className="tweak-row">
          <label className="tweak-label">Limiar de Alerta (%) <span className="tweak-val">{tweaks.alertThreshold}%</span></label>
          <input type="range" min={50} max={95} step={5} value={tweaks.alertThreshold}
            onChange={e => updateTweak('alertThreshold', Number(e.target.value))} />
        </div>

        <div className="tweak-row">
          <label>
            <input type="checkbox" checked={tweaks.showSparklines}
              onChange={e => updateTweak('showSparklines', e.target.checked)} />
            Mostrar histórico de vazão
          </label>
        </div>

        <div className="tweak-row">
          <span className="tweak-label">Cor de Destaque</span>
          <select value={tweaks.accentColor} onChange={e => updateTweak('accentColor', e.target.value)}>
            <option value="blue">Azul Cagece (#0068B4)</option>
            <option value="teal">Verde Teal (#00A878)</option>
            <option value="indigo">Índigo</option>
          </select>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
